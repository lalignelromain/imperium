<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pikachu 30th - Mewthology</title>

    <!-- PWA & Métadonnées Mobiles -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#050608">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mewthology">
    <link rel="apple-touch-icon" href="./favicon.png">
    <link rel="icon" type="image/png" href="./favicon.png">

    <!-- Feuilles de style -->
    <link rel="stylesheet" href="./scripts/assets/css/style.css">

    <!-- SDK Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body class="theme-pikachu">

    <!-- Filigranes d'arrière-plan interactifs -->
    <img src="./scripts/assets/img/mew.png" alt="Mew" class="bg-watermark bg-mew">
    <img src="./scripts/assets/img/mewtwo.png" alt="Mewtwo" class="bg-watermark bg-mewtwo">

    <!-- En-tête Principal -->
    <header class="header-main">
        <h1 style="background: linear-gradient(135deg, #fef08a 0%, #ca8a04 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">PIKACHU 30TH</h1>
        <p class="subtitle">Set Commémoratif • 1996 - 2026</p>
    </header>

    <!-- Conteneur de la Collection -->
    <main class="collection-container">
        <!-- Le script JS viendra injecter les 30 slots Vault X ici -->
        <div class="binder-deck pikachu-binder" id="pikachu-binder-container">
            <div class="vaultx-page" id="pikachu-page"></div>
        </div>
    </main>

    <!-- LIGHTBOX COLLECTAURA (Mode 2D Plat) -->
    <div class="lightbox-overlay" id="collectaura-lightbox" onclick="closeCollectAura()">
        <!-- Le Cadre Acrylique avec l'illustration étendue -->
        <div class="collectaura-frame" id="collectaura-frame-bg" onclick="event.stopPropagation()">
            
            <!-- Les 4 vis métalliques -->
            <div class="frame-screw top-left"></div>
            <div class="frame-screw top-right"></div>
            <div class="frame-screw bottom-left"></div>
            <div class="frame-screw bottom-right"></div>

            <!-- Emplacement Logo CollectAura -->
            <div class="collectaura-logo-area">
                <span>CollectAura</span>
            </div>

            <!-- Le boitier Slab encastré (sans étiquette) -->
            <div class="collectaura-slab-core">
                <div class="slab-inner-recess">
                    <img id="collectaura-card-img" src="" alt="Carte Pikachu">
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="./scripts/assets/js/pikachu-data.js"></script>
    <script src="./scripts/assets/js/script.js"></script>
</body>
</html>
