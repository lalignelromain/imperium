<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mewthology - Club Privé</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="scripts/assets/css/style.css?v=7">

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        /* ==========================================
           MÉCANIQUE DU SLIDER PLEIN ÉCRAN
        ========================================== */
        body.page-private {
            font-family: 'Montserrat', sans-serif;
            background-color: #000000;
            color: #ffffff;
            
            /* BLOQUE TOUT SCROLL PARALLAXE OU FANTÔME */
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            overflow: hidden;
            
            margin: 0;
            padding: 0;
        }

        .slider-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }

        .slide {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            transform: translateX(50px);
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(0);
            z-index: 10;
        }

        /* ==========================================
           DESIGN DE L'ANTICHAMBRE (SLIDE 1)
        ========================================== */
        #slide-1 {
            background: radial-gradient(circle at 75% 50%, #1a0a2e 0%, #030105 55%, #000000 100%);
            display: flex;
            flex-direction: row;
            align-items: center;
            overflow: hidden; 
        }

        .hero-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            height: 100%;
            text-align: left;
            padding: 0 10vw;
            max-width: 50vw;
            pointer-events: none; /* Laisse passer le clic à travers le texte */
        }

        .massive-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(3.5rem, 8vw, 8rem);
            font-weight: 900;
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: -2px;
            margin-bottom: 5px; /* Réduit pour coller au sous-titre */
            opacity: 0;
            transform: translateY(30px);
        }

        .slide.active .massive-title {
            animation: slideUpFade 1s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
        }

        .massive-title span {
            display: block;
            /* Le dégradé sombre et mat validé */
            background: linear-gradient(180deg, #85709c 0%, #5f457a 50%, #372152 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            /* Profondeur sans halo lumineux */
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.95)) drop-shadow(0 5px 30px rgba(20, 5, 40, 0.8));
        }

        .hub-subtitle {
            font-size: clamp(0.8rem, 1.5vw, 1.2rem);
            color: #a76cf2;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 600;
            margin-top: 15px;
            border-left: 3px solid #a76cf2;
            padding-left: 15px;
            opacity: 0;
            transform: translateY(20px);
        }
        
        .slide.active .hub-subtitle {
            animation: slideUpFade 1s cubic-bezier(0.16, 1, 0.3, 1) 0.7s forwards;
        }

        .hotesse-container {
            position: absolute; 
            top: 50%;
            transform: translateY(-50%);
            right: 5%; 
            height: 85vh; 
            width: auto; 
            z-index: 5;
            display: block; 
            cursor: pointer; 
            pointer-events: auto; /* Capte le clic */
        }

        .model-character {
            height: 100%; width: auto; 
            display: block; 
            object-fit: contain;
            object-position: center right; 
            
            /* Piqué HD et ombre d'assise profonde pour Ludvina */
            filter: drop-shadow(-15px 15px 20px rgba(0,0,0,1)) contrast(1.15) saturate(1.1) brightness(1.05);
            
            opacity: 0; 
            transform: translateX(50px);
            transition: opacity 1.5s ease 0.5s, transform 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.5s, filter 0.4s ease;
        }

        .slide.active .model-character {
            opacity: 1; transform: translateX(0);
        }

        .hotesse-container:hover .model-character { 
            /* On garde les réglages de netteté et on booste juste un peu la luminosité au survol */
            filter: drop-shadow(-15px 15px 20px rgba(0,0,0,1)) contrast(1.15) saturate(1.1) brightness(1.2); 
        }

        /* ==========================================
           PARTICULES (Les 120 lucioles nettes)
        ========================================== */
        .particles-container {
            position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            bottom: -20px;
            background: #a76cf2; 
            box-shadow: 0 0 4px 1px rgba(167, 108, 242, 0.9), 
                        0 0 12px 3px rgba(167, 108, 242, 0.5);
            animation: floatUp linear infinite;
            opacity: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
        }

        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }

        /* ==========================================
           DESIGN DE LA GALERIE (SLIDE 2)
        ========================================== */
        .slide-gallery {
            background-color: #030105;
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; 
            align-items: center;
            justify-content: flex-start;
            padding-top: 20px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 30px;
            max-width: 1300px;
            width: 100%;
            padding: 20px 20px 40px 20px;
            margin: 0 auto;
            justify-items: center;
        }

        .card-fullart {
            width: 100%; max-width: 270px; height: 380px; border-radius: 12px; overflow: hidden;
            position: relative; box-shadow: 0 15px 35px rgba(0,0,0,0.8); 
            border: 3px solid rgba(167, 108, 242, 0.3); 
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.4s ease, border-color 0.4s ease; 
            cursor: pointer; display: flex; flex-direction: column; justify-content: flex-end; padding: 25px 20px;
        }
        
        /* EFFET VERRE DÉPOLI SUR L'IMAGE */
        .card-fullart img { 
            position: absolute; 
            inset: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            filter: blur(15px) brightness(0.6); 
            transform: scale(1.1); 
            transition: transform 0.6s ease, filter 0.6s ease; 
            z-index: 1; 
        }
        
        .card-fullart::after { 
            content:''; position:absolute; inset:0; 
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 40%, transparent 100%); 
            z-index: 2; transition: opacity 0.4s;
        }
        
        .card-fullart:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(101, 44, 160, 0.5); border-color: #a76cf2; }
        
        /* RÉVÉLATION DE L'IMAGE AU SURVOL */
        .card-fullart:hover img { 
            filter: blur(0px) brightness(1); 
            transform: scale(1.06); 
        }

        .fullart-content { position: relative; z-index: 3; transform: translateY(5px); transition: transform 0.3s ease; }
        .card-fullart:hover .fullart-content { transform: translateY(0); }
        
        .fullart-title { font-family: 'Cinzel', serif; font-size: 1.8rem; color: #fff; text-shadow: 0 5px 15px rgba(0,0,0,1); line-height: 1.1; margin-bottom: 5px; }
        .fullart-subtitle { font-family: 'Montserrat', sans-serif; font-size: 0.7rem; color: #a76cf2; letter-spacing: 2px; font-weight: 600; text-transform: uppercase; }

        /* ==========================================
           LA MODALE (POP-UP ZOOM)
        ========================================== */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        
        .modal-overlay.active {
            opacity: 1; pointer-events: auto;
        }

        .modal-close {
            position: absolute; top: 25px; right: 30px; color: #fff; font-size: 3rem;
            font-weight: 300; cursor: pointer; transition: transform 0.3s ease, color 0.3s ease;
            z-index: 10000; font-family: 'Montserrat', sans-serif; line-height: 1;
        }
        .modal-close:hover { transform: scale(1.2); color: #a76cf2; }

        .modal-image-container {
            position: relative; max-width: 90vw; max-height: 75vh;
            transform: scale(0.95); transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal-overlay.active .modal-image-container {
            transform: scale(1);
        }

        .modal-main-img {
            max-width: 100%; max-height: 75vh; object-fit: contain;
            border-radius: 8px; box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            border: 2px solid rgba(167, 108, 242, 0.3);
        }

        .modal-thumbnails {
            display: none;
            gap: 15px; margin-top: 30px; align-items: center; justify-content: center;
        }
        
        .thumb {
            width: 60px; height: 60px; border-radius: 6px; object-fit: cover;
            cursor: pointer; transition: all 0.3s ease;
        }
        .thumb.active { border: 2px solid #a76cf2; box-shadow: 0 0 15px rgba(101, 44, 160, 0.5); opacity: 1; }

        /* ==========================================
           RESPONSIVE MOBILE / MEDIA QUERIES
        ========================================== */
        @media (max-width: 768px) {
            #slide-1 { 
                display: block; 
                position: relative; 
            }
            .hero-content { 
                position: absolute; 
                top: 0; 
                left: 0; 
                width: 100%; 
                height: 100%; 
                padding: 0 5vw; 
                align-items: flex-start;
                justify-content: center; 
                z-index: 10;
                pointer-events: none; 
            }
            .massive-title { 
                font-size: clamp(3rem, 12vw, 4rem); 
                text-align: left; 
                margin-bottom: 0;
            }
            
            .hotesse-container { 
                position: absolute; 
                top: 50% !important; 
                transform: translateY(-50%) !important; 
                bottom: auto !important; 
                right: -5vw; 
                width: 100vw; 
                height: 80dvh; 
                display: flex; 
                justify-content: flex-end; 
                z-index: 5;
                pointer-events: auto; 
            }
            .model-character { 
                object-fit: contain; 
                object-position: center right; 
                height: 100%; 
                width: auto; 
            }
            
            .slide-gallery header.header-main { 
                padding: 25px 15px 10px !important; 
            }
            .slide-gallery header.header-main h2 { 
                font-size: 1.8rem !important; 
                letter-spacing: 2px !important; 
            }
            .slide-gallery header.header-main p { 
                font-size: 0.65rem !important; 
                letter-spacing: 1.5px !important; 
            }
            .cards-grid { 
                display: grid !important; 
                grid-template-columns: repeat(2, 1fr) !important; 
                gap: 15px !important; 
                padding: 10px 10px 40px 10px !important; 
            }
            .card-fullart { 
                width: 100% !important; 
                height: auto !important; 
                aspect-ratio: 63/88; 
                padding: 10px !important; 
                max-width: none !important;
                border-width: 2px !important;
            }
            .fullart-title { font-size: 1.2rem !important; margin-bottom: 2px; }
            .fullart-subtitle { font-size: 0.6rem !important; letter-spacing: 1px !important; }

            .modal-close { top: 15px; right: 20px; font-size: 2.2rem; }
        }

        @media (max-width: 480px) {
            .massive-title { font-size: 2.5rem; }
        }
    </style>
</head>

<body class="theme-mew page-private">

    <div class="slider-container">

        <!-- SLIDE 1 : ACCUEIL -->
        <div id="slide-1" class="slide active">
            <!-- Particules générées dynamiquement -->
            <div class="particles-container" id="particles"></div>
            
            <div class="hero-content">
                <h1 class="massive-title">
                    <span>CLUB</span>
                    <span class="highlight">PRIVÉ</span>
                </h1>
                <div class="hub-subtitle">Accès réservé aux membres</div>
            </div>

            <div class="hotesse-container" onclick="goToSlide('slide-2')" title="Accéder à la collection">
                <img src="./assets/cards/dresseuses/lulud.png" alt="Ludvina" class="model-character" onerror="this.src='lulud.png'">
            </div>
        </div>

        <!-- SLIDE 2 : GALERIE -->
        <div id="slide-2" class="slide slide-gallery">
            <header class="header-main" style="text-align: center;">
                <h2 style="font-family: 'Cinzel', serif; font-size: 2.8rem; color: #fff; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 5px;">
                    Archives Privées
                </h2>
                <p style="color: #a76cf2; font-weight: bold; letter-spacing: 2px; font-family: 'Montserrat', sans-serif;">
                    L'ÉLITE DES DRESSEUSES
                </p>
            </header>

            <main class="collection-workspace" style="width: 100%; display: flex; justify-content: center;">
                <div class="cards-grid" id="private-secret-grid">
                    <!-- Injecté par JavaScript -->
                </div>
            </main>
        </div>

    </div>

    <!-- LA MODALE -->
    <div id="modal-zoom" class="modal-overlay">
        <span class="modal-close" onclick="fermerModale()">&times;</span>
        
        <div class="modal-image-container">
            <img id="image-principale" class="modal-main-img" src="" alt="Vue détaillée">
        </div>

        <div class="modal-thumbnails" id="piste-miniatures"></div>
    </div>

    <script src="scripts/assets/js/dresseuses-data.js"></script>
    <script src="scripts/assets/js/script.js"></script>

   <script>
        function goToSlide(slideId) {
            document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
            document.getElementById(slideId).classList.add('active');
            window.scrollTo(0, 0);
        }

        document.addEventListener("DOMContentLoaded", () => {
            // Générateur des 120 particules du Hub Privé
            const container = document.getElementById('particles');
            if(container) {
                const particleCount = 120;
                for (let i = 0; i < particleCount; i++) {
                    let particle = document.createElement('div');
                    particle.classList.add('particle');
                    
                    let size = Math.random() * 3 + 2;
                    particle.style.width = size + 'px';
                    particle.style.height = size + 'px';
                    particle.style.left = Math.random() * 100 + 'vw';
                    particle.style.animationDuration = (Math.random() * 15 + 10) + 's';
                    particle.style.animationDelay = (Math.random() * 10) + 's';

                    container.appendChild(particle);
                }
            }

            // Génération de la galerie de cartes
            setTimeout(() => {
                const gridContainer = document.getElementById('private-secret-grid');
                if (!gridContainer || typeof REGISTRE_SECRET === 'undefined') return;

                let htmlContent = '';

                // On boucle sur chaque dresseuse du registre
                for (const [trainerName, secretImages] of Object.entries(REGISTRE_SECRET)) {
                    if (!secretImages || secretImages.length === 0) continue;

                    // 1. On ne prend QUE la première image pour l'affichage dans la grille
                    const coverImgSrc = `./assets/cards/dresseuses/${secretImages[0]}`;

                    // 2. On passe le NOM de la dresseuse à la modale (et non plus juste l'image)
                    htmlContent += `
                        <div class="card-fullart" onclick="ouvrirModale('${trainerName}')">
                            <img src="${coverImgSrc}" alt="${trainerName}" loading="lazy" onerror="this.src='scripts/assets/img/back-fr.png'">
                            <div class="fullart-content">
                                <div class="fullart-title">${trainerName}</div>
                                <div class="fullart-subtitle">Édition Secrète</div>
                            </div>
                        </div>
                    `;
                }
                gridContainer.innerHTML = htmlContent;
            }, 100);
        });

        const modale = document.getElementById('modal-zoom');
        const imgPrincipale = document.getElementById('image-principale');
        const pisteMiniatures = document.getElementById('piste-miniatures');

        function ouvrirModale(trainerName) {
            const secretImages = REGISTRE_SECRET[trainerName];
            if (!secretImages || secretImages.length === 0) return;

            // On affiche la première image par défaut
            imgPrincipale.src = `./assets/cards/dresseuses/${secretImages[0]}`;

            // S'il y a plusieurs cartes pour cette dresseuse, on génère les miniatures
            if (secretImages.length > 1) {
                let thumbsHTML = '';
                secretImages.forEach((imgFile, index) => {
                    const thumbSrc = `./assets/cards/dresseuses/${imgFile}`;
                    const activeClass = index === 0 ? 'active' : '';
                    thumbsHTML += `<img src="${thumbSrc}" class="thumb ${activeClass}" alt="${trainerName} ${index + 1}" onclick="changerImageModale(event, '${thumbSrc}', this)">`;
                });
                pisteMiniatures.innerHTML = thumbsHTML;
                pisteMiniatures.style.display = 'flex'; // Affiche la piste
            } else {
                pisteMiniatures.innerHTML = '';
                pisteMiniatures.style.display = 'none'; // Cache la piste s'il n'y a qu'une carte
            }

            modale.classList.add('active');
        }

        // Fonction pour changer l'image principale quand on clique sur une miniature
        function changerImageModale(event, src, thumbElement) {
            event.stopPropagation(); // Évite que le clic ne ferme la modale
            imgPrincipale.src = src;
            
            // Met à jour la miniature active (bordure violette)
            document.querySelectorAll('.modal-thumbnails .thumb').forEach(t => t.classList.remove('active'));
            thumbElement.classList.add('active');
        }

        function fermerModale() {
            modale.classList.remove('active');
            setTimeout(() => { 
                if(!modale.classList.contains('active')) {
                    imgPrincipale.src = ''; 
                    pisteMiniatures.innerHTML = ''; // Nettoie les miniatures
                }
            }, 400);
        }

        modale.addEventListener('click', function(e) {
            // Ferme la modale uniquement si on clique en dehors de l'image et des miniatures
            if (e.target === modale || e.target.classList.contains('modal-image-container')) {
                fermerModale();
            }
        });
    </script>
</body>
</html>
