<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mewthology - Club Privé</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="scripts/assets/css/style.css?v=7">

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        /* ==========================================
           MÉCANIQUE DU SLIDER PLEIN ÉCRAN
        ========================================== */
        body.page-private {
            font-family: 'Montserrat', sans-serif;
            background-color: #000000;
            color: #ffffff;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        .slider-container {
            position: absolute; inset: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000000;
        }

        .slide {
            position: absolute; inset: 0; width: 100%; height: 100%;
            opacity: 0; visibility: hidden;
            transition: opacity 0.8s ease;
            display: flex; flex-direction: column;
        }

        .slide.active {
            opacity: 1; visibility: visible; z-index: 10;
        }

        /* ==========================================
           DESIGN DE L'ANTICHAMBRE (SLIDE 1)
        ========================================== */
        #slide-1 { background-color: #000; }

        .ui-layer {
            position: absolute; inset: 0; z-index: 5;
            display: flex; align-items: center;
        }

        .hero-content {
            position: relative; z-index: 10; padding: 0 10vw; max-width: 50vw;
            pointer-events: none;
        }
        
        .massive-title {
            font-family: 'Cinzel', serif; 
            font-size: clamp(2.5rem, 6vw, 5.5rem); 
            font-weight: 700; line-height: 1.1; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px;
            background: linear-gradient(180deg, #9b87b0 0%, #6f548f 50%, #462c66 100%); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8)); 
        }
        
        .hub-subtitle {
            font-size: clamp(0.7rem, 1.2vw, 1rem); color: #bfa3ed; letter-spacing: 6px; text-transform: uppercase; font-weight: 400; margin-top: 15px;
            border-left: 2px solid #a76cf2; padding-left: 15px; opacity: 0.9;
        }

        .hotesse-container {
            position: absolute; top: 58%; left: 50%; transform: translate(-50%, -50%); 
            height: 85vh; width: auto; z-index: 10; cursor: pointer; pointer-events: auto;
        }
        
        .model-character {
            height: 100%; width: auto; object-fit: contain; object-position: center;
            filter: drop-shadow(-10px 10px 30px rgba(0,0,0,0.65)) contrast(1.02) saturate(1.05) brightness(0.95);
            transition: filter 0.5s ease;
        }
        .hotesse-container:hover .model-character {
            filter: drop-shadow(-12px 15px 40px rgba(0,0,0,0.85)) contrast(1.1) saturate(1.1) brightness(1.1); 
        }

        /* ==========================================
           COUCHE VIDÉO DE TRANSITION
        ========================================== */
        .video-container {
            position: absolute; inset: 0; width: 100%; height: 100%;
            z-index: 50; background-color: #000; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; 
        }
        .video-container.playing { opacity: 1; pointer-events: auto; }
        .video-container.fade-out { opacity: 0; pointer-events: none; transition: opacity 0.8s ease; }
        .video-container video { width: 100%; height: 100%; object-fit: cover; }

        /* ==========================================
           DESIGN DE LA GALERIE (SLIDE 2) - 4x2 SANS SCROLL
        ========================================== */
        .slide-gallery {
            background-color: #030105;
            overflow: hidden !important; 
            align-items: center; justify-content: center;
            padding: 10px 20px;
        }

        .slide-gallery header.header-main {
            padding: 10px 20px 5px !important;
        }

        .collection-workspace {
            width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1;
        }

        /* Grille fixe de 4 colonnes sur 2 lignes (8 cartes max par écran) */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-template-rows: repeat(2, auto);
            gap: 15px;
            max-width: 1000px;
            width: 100%;
            padding: 5px 20px;
            margin: 0 auto;
            justify-items: center;
            align-items: center;
        }

        .card-fullart {
            width: 100%; max-width: 190px; height: 260px; border-radius: 10px; overflow: hidden;
            position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.8); 
            border: none; 
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.3s ease; 
            cursor: pointer; display: flex; flex-direction: column; justify-content: flex-end; padding: 15px 12px;
        }
        .card-fullart img { 
            position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; 
            filter: blur(15px) brightness(0.6); transform: scale(1.1); transition: transform 0.5s ease, filter 0.5s ease; z-index: 1; 
        }
        .card-fullart::after { 
            content:''; position:absolute; inset:0; 
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 40%, transparent 100%); 
            z-index: 2;
        }
        .card-fullart:hover { transform: translateY(-6px); box-shadow: 0 15px 30px rgba(101, 44, 160, 0.5); }
        .card-fullart:hover img { filter: blur(0px) brightness(1); transform: scale(1.05); }

        .fullart-content { position: relative; z-index: 3; transform: translateY(3px); transition: transform 0.3s ease; }
        .card-fullart:hover .fullart-content { transform: translateY(0); }
        
        .fullart-title { font-family: 'Cinzel', serif; font-size: 1.2rem; color: #fff; text-shadow: 0 3px 10px rgba(0,0,0,1); line-height: 1.1; margin-bottom: 2px; }
        .fullart-subtitle { font-family: 'Montserrat', sans-serif; font-size: 0.55rem; color: #a76cf2; letter-spacing: 1.5px; font-weight: 600; text-transform: uppercase; }

        /* Pagination intégrée et bien visible */
        .pagination-container {
            display: flex; gap: 20px; margin-top: 15px; margin-bottom: 10px; justify-content: center; width: 100%;
        }
        .pagination-container button { 
            background: transparent; border: 1px solid rgba(167, 108, 242, 0.4); color: #ffffff; padding: 10px 25px; 
            border-radius: 30px; cursor: pointer; font-family: 'Montserrat', sans-serif; font-size: 0.75rem; 
            letter-spacing: 2px; text-transform: uppercase; transition: all 0.3s ease; backdrop-filter: blur(5px); 
        }
        .pagination-container button:hover:not(:disabled) { 
            background: #652CA0; color: #fff; border-color: #652CA0; box-shadow: 0 8px 15px rgba(101, 44, 160, 0.4); transform: translateY(-2px); 
        }
        .pagination-container button:disabled { opacity: 0.3; cursor: not-allowed; border-color: rgba(255, 255, 255, 0.1); }

        /* ==========================================
           LA MODALE (POP-UP ZOOM)
        ========================================== */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-close {
            position: absolute; top: 25px; right: 30px; color: #fff; font-size: 3rem;
            font-weight: 300; cursor: pointer; transition: transform 0.3s ease, color 0.3s ease;
            z-index: 10000; font-family: 'Montserrat', sans-serif; line-height: 1;
        }
        .modal-close:hover { transform: scale(1.2); color: #a76cf2; }

        .modal-image-container {
            position: relative; max-width: 90vw; max-height: 75vh;
            transform: scale(0.95); transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal-overlay.active .modal-image-container { transform: scale(1); }

        .modal-main-img {
            max-width: 100%; max-height: 75vh; object-fit: contain;
            border-radius: 8px; box-shadow: 0 30px 60px rgba(0,0,0,0.8); border: none;
            cursor: zoom-in; will-change: transform;
        }
        .modal-main-img.grab { cursor: grab; }
        .modal-main-img.grabbing { cursor: grabbing; }

        .modal-thumbnails {
            display: none; gap: 15px; margin-top: 20px; align-items: center; justify-content: center; flex-wrap: wrap; max-width: 90vw;
        }
        .thumb {
            width: 50px; height: 50px; border-radius: 6px; object-fit: cover;
            cursor: pointer; transition: all 0.3s ease;
        }
        .thumb.active { border: 2px solid #a76cf2; box-shadow: 0 0 15px rgba(101, 44, 160, 0.5); opacity: 1; }

        /* ==========================================
           RESPONSIVE MOBILE / MEDIA QUERIES
        ========================================== */
        @media (max-width: 768px) {
            #slide-1 { display: block; position: relative; }
            .hero-content { position: absolute; top: 0; left: 0; width: 100%; height: 100%; padding: 0 5vw; align-items: flex-start; justify-content: center; z-index: 10; }
            .massive-title { font-size: clamp(2rem, 10vw, 3rem); text-align: left; margin-bottom: 0; }
            .hotesse-container { top: 58% !important; left: 50% !important; transform: translate(-50%, -50%) !important; right: auto !important; width: 100vw; height: 80dvh; display: flex; justify-content: center; }
            .model-character { height: 100%; width: auto; object-fit: contain; object-position: center; }
            
            .slide-gallery header.header-main { padding: 15px 15px 5px !important; }
            .slide-gallery header.header-main h2 { font-size: 1.5rem !important; letter-spacing: 2px !important; }
            .slide-gallery header.header-main p { font-size: 0.6rem !important; letter-spacing: 1px !important; }
            
            .cards-grid { 
                grid-template-columns: repeat(2, minmax(0, 1fr)) !important; 
                grid-template-rows: repeat(4, auto) !important;
                gap: 8px !important; padding: 5px 10px !important; 
            }
            .card-fullart { width: 100% !important; height: auto !important; aspect-ratio: 63/88; padding: 8px !important; max-width: none !important; }
            .fullart-title { font-size: 1rem !important; margin-bottom: 2px; }
            .fullart-subtitle { font-size: 0.55rem !important; }

            .modal-close { top: 15px; right: 20px; font-size: 2.2rem; }
            .modal-thumbnails { gap: 8px; margin-top: 15px; }
            .thumb { width: 40px; height: 40px; }
        }
        @media (max-width: 480px) { .massive-title { font-size: 2.5rem; } }
    </style>
</head>

<body class="theme-mew page-private">

    <div class="slider-container">
        <!-- SLIDE 1 : ACCUEIL -->
        <div id="slide-1" class="slide active">
            <img src="scripts/assets/img/bg-boudoir.jpg" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1;" alt="Décor du Club">
            <div class="ui-layer">
                <div class="hero-content">
                    <h1 class="massive-title">
                        <span style="display:block;">CLUB</span>
                        <span style="display:block;" class="highlight">PRIVÉ</span>
                    </h1>
                    <div class="hub-subtitle">Accès réservé aux membres</div>
                </div>
                <div class="hotesse-container" onclick="lancerVideo()" title="Entrer">
                    <img src="./assets/cards/dresseuses/lulud.png" alt="Ludvina" class="model-character" onerror="this.src='lulud.png'">
                </div>
            </div>
        </div>

        <!-- SLIDE 2 : GALERIE 4x2 SANS SCROLL -->
        <div id="slide-2" class="slide slide-gallery">
            <header class="header-main" style="text-align: center;">
                <h2 style="font-family: 'Cinzel', serif; font-size: 2.4rem; color: #fff; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 2px;">
                    Archives Privées
                </h2>
                <p style="color: #a76cf2; font-weight: bold; letter-spacing: 2px; font-family: 'Montserrat', sans-serif; font-size: 0.8rem;">
                    L'ÉLITE DES DRESSEUSES
                </p>
            </header>

            <main class="collection-workspace">
                <div class="cards-grid" id="private-secret-grid">
                    <!-- Injecté par JavaScript -->
                </div>
                <div id="private-pagination" class="pagination-container">
                    <!-- Boutons injectés par JS -->
                </div>
            </main>
        </div>

        <!-- COUCHE VIDÉO DE TRANSITION -->
        <div class="video-container" id="intro-video-container">
            <video id="intro-video" muted playsinline disablePictureInPicture>
                <source src="scripts/assets/video/intro-mobile.mp4" type="video/mp4" media="(max-width: 768px)">
                <source src="scripts/assets/video/intro-desktop.mp4" type="video/mp4">
            </video>
        </div>
    </div>

    <!-- LA MODALE -->
    <div id="modal-zoom" class="modal-overlay">
        <span class="modal-close" onclick="fermerModale()">&times;</span>
        <div class="modal-image-container">
            <img id="image-principale" class="modal-main-img" src="" alt="Vue détaillée">
        </div>
        <div class="modal-thumbnails" id="piste-miniatures"></div>
    </div>

    <!-- BARRE DE NAVIGATION DU SALON PRIVÉ -->
    <div class="floating-dock">
        <a href="index.html" class="dock-btn" title="Verrouiller et Quitter" style="color: #a76cf2; border-color: rgba(167, 108, 242, 0.4);">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0"></path>
            </svg>
        </a>
    </div>

    <script src="scripts/assets/js/dresseuses-data.js"></script>
    <script src="scripts/assets/js/script.js"></script>

    <script>
        // ==========================================
        // 1. GESTION DE LA VIDÉO ET DE LA TRANSITION
        // ==========================================
        const video = document.getElementById('intro-video');
        const videoContainer = document.getElementById('intro-video-container');
        const slide1 = document.getElementById('slide-1');
        const slide2 = document.getElementById('slide-2');
        let isTransitioning = false;
        const FADE_OFFSET = 0.4; 

        function lancerVideo() {
            videoContainer.classList.remove('fade-out');
            videoContainer.classList.add('playing');
            video.currentTime = 0;
            video.play();
            isTransitioning = false;
        }

        video.addEventListener('timeupdate', () => {
            if (!isTransitioning && video.duration > 0 && (video.duration - video.currentTime) <= FADE_OFFSET) {
                triggerTransition();
            }
        });

        video.addEventListener('ended', () => { if (!isTransitioning) triggerTransition(); });

        function triggerTransition() {
            isTransitioning = true;
            videoContainer.classList.remove('playing');
            videoContainer.classList.add('fade-out');
            slide1.classList.remove('active');
            slide2.classList.add('active');
            setTimeout(() => { video.pause(); }, 1000); 
        }

        // ==========================================
        // 2. GÉNÉRATION DE LA GALERIE 4x2
        // ==========================================
        let currentPagePrivate = 0;
        const CARDS_PER_PAGE_PRIVATE = 8; // Format 4x2 (8 cartes max par écran)

        function renderPrivateGallery() {
            const gridContainer = document.getElementById('private-secret-grid');
            const navContainer = document.getElementById('private-pagination');
            if (!gridContainer || typeof REGISTRE_SECRET === 'undefined') return;

            let allItems = [];
            
            for (const [trainerName, secretImages] of Object.entries(REGISTRE_SECRET)) {
                if (secretImages && secretImages.length > 0) {
                    allItems.push({ type: 'known', name: trainerName, images: secretImages });
                }
            }

            if (typeof CARTES_ORPHELINES !== 'undefined' && CARTES_ORPHELINES.length > 0) {
                allItems.push({ type: 'mystery' });
            }

            const totalPages = Math.ceil(allItems.length / CARDS_PER_PAGE_PRIVATE);
            if (currentPagePrivate >= totalPages) currentPagePrivate = Math.max(0, totalPages - 1);
            if (currentPagePrivate < 0) currentPagePrivate = 0;

            const pageItems = allItems.slice(currentPagePrivate * CARDS_PER_PAGE_PRIVATE, (currentPagePrivate + 1) * CARDS_PER_PAGE_PRIVATE);
            
            let htmlContent = '';
            
            pageItems.forEach(item => {
                if (item.type === 'known') {
                    const coverImgSrc = `./assets/cards/dresseuses/${item.images[0]}`;
                    htmlContent += `
                        <div class="card-fullart" onclick="ouvrirModale('${item.name}')">
                            <img src="${coverImgSrc}" alt="${item.name}" loading="lazy" onerror="this.src='scripts/assets/img/back-fr.png'">
                            <div class="fullart-content">
                                <div class="fullart-title">${item.name}</div>
                                <div class="fullart-subtitle">Édition Secrète</div>
                            </div>
                        </div>
                    `;
                } else if (item.type === 'mystery') {
                    htmlContent += `
                        <div class="card-fullart" style="border: 2px dashed rgba(167, 108, 242, 0.4);" onclick="ouvrirModaleOrphelines()">
                            <img src="scripts/assets/img/back-fr.png" alt="Inconnues" loading="lazy">
                            <div class="fullart-content">
                                <div class="fullart-title" style="color: #bfa3ed; letter-spacing: 4px;">? ? ?</div>
                                <div class="fullart-subtitle">Dresseuses Inconnues</div>
                            </div>
                        </div>
                    `;
                }
            });

            gridContainer.innerHTML = htmlContent;

            navContainer.innerHTML = '';
            if (totalPages > 1) {
                const btnPrev = document.createElement('button');
                btnPrev.innerHTML = "◀ Précédent";
                btnPrev.disabled = currentPagePrivate === 0;
                btnPrev.onclick = () => { 
                    if (currentPagePrivate > 0) { 
                        currentPagePrivate--; 
                        renderPrivateGallery(); 
                    } 
                };

                const btnNext = document.createElement('button');
                btnNext.innerHTML = "Suivant ▶";
                btnNext.disabled = currentPagePrivate >= totalPages - 1;
                btnNext.onclick = () => { 
                    if (currentPagePrivate < totalPages - 1) { 
                        currentPagePrivate++; 
                        renderPrivateGallery(); 
                    } 
                };

                navContainer.appendChild(btnPrev);
                navContainer.appendChild(btnNext);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(renderPrivateGallery, 100);
        });

        // ==========================================
        // 3. GESTION DE LA MODALE
        // ==========================================
        const modale = document.getElementById('modal-zoom');
        const imgPrincipale = document.getElementById('image-principale');
        const pisteMiniatures = document.getElementById('piste-miniatures');

        function ouvrirModale(trainerName) {
            const secretImages = REGISTRE_SECRET[trainerName];
            if (!secretImages || secretImages.length === 0) return;

            imgPrincipale.src = `./assets/cards/dresseuses/${secretImages[0]}`;

            if (secretImages.length > 1) {
                let thumbsHTML = '';
                secretImages.forEach((imgFile, index) => {
                    const thumbSrc = `./assets/cards/dresseuses/${imgFile}`;
                    const activeClass = index === 0 ? 'active' : '';
                    thumbsHTML += `<img src="${thumbSrc}" class="thumb ${activeClass}" alt="${trainerName} ${index + 1}" onclick="changerImageModale(event, '${thumbSrc}', this)">`;
                });
                pisteMiniatures.innerHTML = thumbsHTML;
                pisteMiniatures.style.display = 'flex'; 
            } else {
                pisteMiniatures.innerHTML = '';
                pisteMiniatures.style.display = 'none'; 
            }
            modale.classList.add('active');
        }

        function ouvrirModaleOrphelines() {
            if (typeof CARTES_ORPHELINES === 'undefined' || CARTES_ORPHELINES.length === 0) return;

            imgPrincipale.src = `./assets/cards/dresseuses/${CARTES_ORPHELINES[0]}`;

            if (CARTES_ORPHELINES.length > 1) {
                let thumbsHTML = '';
                CARTES_ORPHELINES.forEach((imgFile, index) => {
                    const thumbSrc = `./assets/cards/dresseuses/${imgFile}`;
                    const activeClass = index === 0 ? 'active' : '';
                    thumbsHTML += `<img src="${thumbSrc}" class="thumb ${activeClass}" alt="Inconnue ${index + 1}" onclick="changerImageModale(event, '${thumbSrc}', this)">`;
                });
                pisteMiniatures.innerHTML = thumbsHTML;
                pisteMiniatures.style.display = 'flex'; 
            } else {
                pisteMiniatures.innerHTML = '';
                pisteMiniatures.style.display = 'none'; 
            }
            modale.classList.add('active');
        }

        function changerImageModale(event, src, thumbElement) {
            resetZoom();
            event.stopPropagation(); 
            imgPrincipale.src = src;
            document.querySelectorAll('.modal-thumbnails .thumb').forEach(t => t.classList.remove('active'));
            thumbElement.classList.add('active');
        }

        function fermerModale() {
            resetZoom();
            modale.classList.remove('active');
            setTimeout(() => { 
                if(!modale.classList.contains('active')) {
                    imgPrincipale.src = ''; 
                    pisteMiniatures.innerHTML = ''; 
                }
            }, 400);
        }

        modale.addEventListener('click', function(e) {
            if (e.target === modale || e.target.classList.contains('modal-image-container')) {
                fermerModale();
            }
        });

        // ==========================================
        // 4. GESTION DU ZOOM ET DÉPLACEMENT (PAN & ZOOM)
        // ==========================================
        let currentScale = 1;
        let translateX = 0, translateY = 0;
        let startX, startY;
        let isDragging = false, hasMoved = false;
        let initialDistance = 0;

        function updateTransform(smooth = false) {
            imgPrincipale.style.transition = smooth ? 'transform 0.3s ease' : 'none';
            imgPrincipale.style.transform = `translate(${translateX}px, ${translateY}px) scale(${currentScale})`;
        }

        function resetZoom() {
            currentScale = 1; translateX = 0; translateY = 0;
            imgPrincipale.classList.remove('grab', 'grabbing');
            updateTransform(true);
        }

        imgPrincipale.addEventListener('click', function(e) {
            if (window.innerWidth <= 768) return; 
            if (hasMoved) return; 
            if (currentScale > 1) { resetZoom(); } 
            else {
                currentScale = 2.2; 
                imgPrincipale.classList.add('grab');
                updateTransform(true);
            }
        });

        function dragStart(e) {
            if (e.type === 'touchstart' && e.touches.length === 2) {
                initialDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                return;
            }
            if (currentScale <= 1) return; 
            isDragging = true; hasMoved = false;
            imgPrincipale.classList.replace('grab', 'grabbing');
            if (e.type === 'touchstart') {
                startX = e.touches[0].clientX - translateX; startY = e.touches[0].clientY - translateY;
            } else {
                e.preventDefault();
                startX = e.clientX - translateX; startY = e.clientY - translateY;
            }
        }

        function drag(e) {
            if (e.type === 'touchmove' && e.touches.length === 2) {
                e.preventDefault(); 
                const currentDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                const scaleMod = currentDist / initialDistance;
                currentScale = Math.min(Math.max(1, currentScale * scaleMod), 4); 
                initialDistance = currentDist;
                imgPrincipale.classList.add('grab');
                updateTransform(false);
                return;
            }
            if (!isDragging) return;
            e.preventDefault(); hasMoved = true;
            if (e.type === 'touchmove') {
                translateX = e.touches[0].clientX - startX; translateY = e.touches[0].clientY - startY;
            } else {
                translateX = e.clientX - startX; translateY = e.clientY - startY;
            }
            updateTransform(false);
        }

    function dragEnd() {
            if (!isDragging && currentScale <= 1) return;
            isDragging = false;
            if (currentScale > 1) imgPrincipale.classList.replace('grabbing', 'grab');
            else resetZoom(); 
        }

        imgPrincipale.addEventListener('mousedown', dragStart);
        imgPrincipale.addEventListener('touchstart', dragStart, { passive: false });
        window.addEventListener('mousemove', drag);
        window.addEventListener('touchmove', drag, { passive: false });
        window.addEventListener('mouseup', dragEnd);
        window.addEventListener('touchend', dragEnd);
    </script>
</body>
