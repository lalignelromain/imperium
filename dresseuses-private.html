<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mewthology - Salon Privé</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    
    <!-- Polices Google -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS Global -->
    <link rel="stylesheet" href="scripts/assets/css/style.css?v=3">

    <!-- SDK Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        /* ==========================================
           MÉCANIQUE DU SLIDER PLEIN ÉCRAN
        ========================================== */
        body.page-private {
            font-family: 'Montserrat', sans-serif;
            background-color: #000000;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
        }

        .slider-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
        }

        .slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            transform: translateX(50px);
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(0);
            z-index: 10;
        }

        /* ==========================================
           DESIGN DE L'ANTICHAMBRE (SLIDE 1)
        ========================================== */
        #slide-1 {
            background: radial-gradient(circle at 75% 50%, #210d3a 0%, #05020a 55%, #000000 100%);
            display: flex;
            flex-direction: row;
            align-items: center;
        }

        .hero-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            height: 100%;
            text-align: left;
            padding: 0 10vw;
            max-width: 50vw;
        }

        .massive-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(3.5rem, 8vw, 8rem);
            font-weight: 900;
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: -2px;
            margin-bottom: 35px;
            opacity: 0;
            transform: translateY(30px);
        }

        .slide.active .massive-title {
            animation: slideUpFade 1s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
        }

        .massive-title span {
            display: block;
            text-shadow: 0 5px 20px rgba(0, 0, 0, 0.8);
        }

        .massive-title .highlight { 
            background: linear-gradient(to right, #ffffff, #8e54e9);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }

        .hotesse-container {
            position: absolute; 
            bottom: 0; right: 5%; 
            height: 92vh; width: auto; 
            z-index: 5;
            display: block; 
            cursor: pointer; 
        }

        .model-character {
            height: 100%; width: auto; 
            display: block; 
            object-fit: contain;
            object-position: bottom right;
            filter: drop-shadow(-20px 20px 40px rgba(0,0,0,0.9));
            opacity: 0; transform: translateX(50px);
            transition: opacity 1.5s ease 0.5s, transform 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.5s, filter 0.4s ease;
        }

        .slide.active .model-character {
            opacity: 1; transform: translateX(0);
        }

        .hotesse-container:hover .model-character { 
            filter: drop-shadow(-20px 20px 40px rgba(0,0,0,0.9)) brightness(1.15); 
        }

        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }

        /* ==========================================
           DESIGN DE LA GALERIE (SLIDE 2)
        ========================================== */
        .slide-gallery {
            background-color: #05020a;
            overflow-y: auto; 
            align-items: center;
            justify-content: flex-start;
            padding-top: 20px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 30px;
            max-width: 1300px;
            width: 100%;
            padding: 20px 20px 120px 20px; /* Espace bas pour laisser respirer la navbar */
            margin: 0 auto;
            justify-items: center;
        }

        .card-fullart {
            width: 100%; max-width: 270px; height: 380px; border-radius: 12px; overflow: hidden;
            position: relative; box-shadow: 0 15px 35px rgba(0,0,0,0.8); 
            border: 3px solid rgba(167, 108, 242, 0.3); 
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.4s ease, border-color 0.4s ease; 
            cursor: pointer; display: flex; flex-direction: column; justify-content: flex-end; padding: 25px 20px;
        }
        .card-fullart img { 
            position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; z-index: 1; 
        }
        .card-fullart::after { 
            content:''; position:absolute; inset:0; 
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 40%, transparent 100%); 
            z-index: 2; transition: opacity 0.4s;
        }
        .card-fullart:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(101, 44, 160, 0.5); border-color: #a76cf2; }
        .card-fullart:hover img { transform: scale(1.06); }

        .fullart-content { position: relative; z-index: 3; transform: translateY(5px); transition: transform 0.3s ease; }
        .card-fullart:hover .fullart-content { transform: translateY(0); }
        
        .fullart-title { 
            font-family: 'Cinzel', serif; font-size: 1.8rem; color: #fff; text-shadow: 0 5px 15px rgba(0,0,0,1); line-height: 1.1; margin-bottom: 5px; 
        }
        .fullart-subtitle { 
            font-family: 'Montserrat', sans-serif; font-size: 0.7rem; color: #a76cf2; letter-spacing: 2px; font-weight: 600; text-transform: uppercase; 
        }

        /* ==========================================
           LA MODALE (POP-UP ZOOM)
        ========================================== */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        
        .modal-overlay.active {
            opacity: 1; pointer-events: auto;
        }

        .modal-close {
            position: absolute; top: 25px; right: 30px; color: #fff; font-size: 3rem;
            font-weight: 300; cursor: pointer; transition: transform 0.3s ease, color 0.3s ease;
            z-index: 10000; font-family: 'Montserrat', sans-serif; line-height: 1;
        }
        .modal-close:hover { transform: scale(1.2); color: #a76cf2; }

        .modal-image-container {
            position: relative; max-width: 90vw; max-height: 75vh;
            transform: scale(0.95); transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal-overlay.active .modal-image-container {
            transform: scale(1);
        }

        .modal-main-img {
            max-width: 100%; max-height: 75vh; object-fit: contain;
            border-radius: 8px; box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            border: 2px solid rgba(167, 108, 242, 0.3);
        }

        .modal-thumbnails {
            display: none;
            gap: 15px; margin-top: 30px; align-items: center; justify-content: center;
        }
        
        .thumb {
            width: 60px; height: 60px; border-radius: 6px; object-fit: cover;
            cursor: pointer; transition: all 0.3s ease;
        }
        .thumb.active { border: 2px solid #a76cf2; box-shadow: 0 0 15px rgba(101, 44, 160, 0.5); opacity: 1; }

        /* ==========================================
           RESPONSIVE MOBILE / MEDIA QUERIES
        ========================================== */
        @media (max-width: 1024px) {
            .massive-title { font-size: clamp(3rem, 7vw, 6rem); }
            .hero-content { padding: 0 5vw; max-width: 60vw; }
            .hotesse-container { height: 85vh; right: -2%; }
        }

        @media (max-width: 768px) {
            /* Slide 1 : Antichambre repensée pour mobile */
            #slide-1 { 
                flex-direction: column; 
                justify-content: space-between; 
                align-items: center; 
                padding-top: 40px;
                text-align: center;
            }
            .hero-content { 
                align-items: center; 
                text-align: center; 
                max-width: 100%; 
                padding: 0 20px; 
                height: auto; 
                z-index: 15; 
                flex-grow: 0;
            }
            .massive-title { 
                font-size: 3rem; 
                margin-bottom: 0; 
                letter-spacing: -1px;
            }
            
            .hotesse-container { 
                position: relative; 
                height: 62vh; 
                width: 100%; 
                right: auto; 
                bottom: 0; 
                display: flex; 
                justify-content: center; 
            }
            .model-character { 
                object-position: bottom center; 
                height: 100%; 
                max-height: 62vh; 
            }
            
            /* Slide 2 : Galerie mobile épurée */
            .slide-gallery header.header-main { 
                padding: 25px 15px 10px !important; 
            }
            .slide-gallery header.header-main h2 { 
                font-size: 1.8rem !important; 
                letter-spacing: 2px !important; 
            }
            .slide-gallery header.header-main p { 
                font-size: 0.65rem !important; 
                letter-spacing: 1.5px !important; 
            }
            
            .cards-grid { 
                grid-template-columns: repeat(2, minmax(0, 1fr)) !important; 
                gap: 12px !important; 
                padding: 15px 10px 110px 10px !important; 
            }
            .card-fullart { 
                width: 100% !important; 
                max-width: none !important; 
                height: 240px !important; 
                padding: 15px 10px !important; 
            }
            .fullart-title { 
                font-size: 1.1rem !important; 
            }
            .fullart-subtitle { 
                font-size: 0.55rem !important; 
                letter-spacing: 1px !important; 
            }

            .modal-close { top: 15px; right: 20px; font-size: 2.2rem; }
        }

        @media (max-width: 480px) {
            .massive-title { font-size: 2.5rem; }
            .cards-grid { 
                grid-template-columns: 1fr !important; 
                max-width: 320px; 
            }
            .card-fullart { 
                height: 320px !important; 
            }
        }

        /* ==========================================
   CORRECTION NAVBAR & LUDVINA (SALON PRIVÉ)
========================================== */
/* Sur PC : Navbar à gauche sous le texte */
body.page-private .floating-dock {
    right: auto !important;
    left: 25px !important;
}

@media (max-width: 768px) {
    /* Sur Mobile : Navbar centrée */
    body.page-private .floating-dock {
        right: auto !important;
        left: 50% !important;
        transform: translateX(-50%) !important;
        width: 92vw !important;
        bottom: 15px !important;
        justify-content: space-evenly !important;
    }
    /* Sur Mobile : On remonte les talons de Ludvina au-dessus de la navbar */
    .hotesse-container {
        bottom: 65px !important;
    }
}
    </style>
</head>

<body class="theme-mew page-private">

    <div class="slider-container">

        <!-- ==========================================
             SLIDE 1 : LE SALON PRIVÉ (ACCUEIL)
             ========================================== -->
        <div id="slide-1" class="slide active">
            
            <div class="hero-content">
                <h1 class="massive-title">
                    <span>SALON</span>
                    <span class="highlight">PRIVÉ</span>
                </h1>
            </div>

            <!-- Clic sur Ludvina bascule vers la galerie -->
            <div class="hotesse-container" onclick="goToSlide('slide-2')" title="Accéder à la collection">
                <img src="./assets/cards/dresseuses/lulud.png" alt="Ludvina" class="model-character" onerror="this.src='lulud.png'">
            </div>

        </div>

        <!-- ==========================================
             SLIDE 2 : LA GALERIE SECRÈTE
             ========================================== -->
        <div id="slide-2" class="slide slide-gallery">
            
            <header class="header-main" style="text-align: center;">
                <h2 style="font-family: 'Cinzel', serif; font-size: 2.8rem; color: #fff; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 5px;">
                    Registre Secret
                </h2>
                <p style="color: #a76cf2; font-weight: bold; letter-spacing: 2px; font-family: 'Montserrat', sans-serif;">
                    COLLECTION INTÉGRALE DES DRESSEUSES
                </p>
            </header>

            <main class="collection-workspace" style="width: 100%; display: flex; justify-content: center;">
                <div class="cards-grid" id="private-secret-grid">
                    <!-- Généré dynamiquement par JavaScript -->
                </div>
            </main>
            
        </div>

    </div>

    <!-- ==========================================
         LA MODALE (ZOOM)
         ========================================== -->
    <div id="modal-zoom" class="modal-overlay">
        <span class="modal-close" onclick="fermerModale()">&times;</span>
        
        <div class="modal-image-container">
            <img id="image-principale" class="modal-main-img" src="" alt="Vue détaillée">
        </div>

        <div class="modal-thumbnails" id="piste-miniatures">
            <!-- Injecté via JavaScript -->
        </div>
    </div>

    <!-- Scripts de données & Moteur -->
    <script src="scripts/assets/js/dresseuses-data.js"></script>
    <script src="scripts/assets/js/script.js"></script>

    <script>
        /* ====================================================================
           MÉCANIQUE DU SLIDER PLEIN ÉCRAN
           ==================================================================== */
        function goToSlide(slideId) {
            document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
            document.getElementById(slideId).classList.add('active');
            window.scrollTo(0, 0);
        }

        /* ====================================================================
           GÉNÉRATION DE LA GALERIE SECRÈTE (DESIGN FULL-ART)
           ==================================================================== */
        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                const gridContainer = document.getElementById('private-secret-grid');
                if (!gridContainer || typeof REGISTRE_SECRET === 'undefined') return;

                let htmlContent = '';

                for (const [trainerName, secretImages] of Object.entries(REGISTRE_SECRET)) {
                    if (!secretImages || secretImages.length === 0) continue;

                    secretImages.forEach((imgFile, index) => {
                        const imgSrc = `./assets/cards/dresseuses/${imgFile}`;
                        const cardTitle = secretImages.length > 1 ? `${trainerName} (${index + 1})` : trainerName;

                        htmlContent += `
                            <div class="card-fullart" onclick="ouvrirModale('${imgSrc}')">
                                <img src="${imgSrc}" alt="${cardTitle}" loading="lazy" onerror="this.src='scripts/assets/img/back-fr.png'">
                                <div class="fullart-content">
                                    <div class="fullart-title">${cardTitle}</div>
                                    <div class="fullart-subtitle">Édition Secrète</div>
                                </div>
                            </div>
                        `;
                    });
                }
                gridContainer.innerHTML = htmlContent;
            }, 100);
        });

        /* ====================================================================
           GESTION DE LA MODALE
           ==================================================================== */
        const modale = document.getElementById('modal-zoom');
        const imgPrincipale = document.getElementById('image-principale');
        const pisteMiniatures = document.getElementById('piste-miniatures');

        function ouvrirModale(imageSrc) {
            imgPrincipale.src = imageSrc;
            
            pisteMiniatures.innerHTML = `
                <img src="${imageSrc}" class="thumb active" alt="Illustration Secrète">
            `;

            modale.classList.add('active');
        }

        function fermerModale() {
            modale.classList.remove('active');
            setTimeout(() => { 
                if(!modale.classList.contains('active')) {
                    imgPrincipale.src = ''; 
                }
            }, 400);
        }

        modale.addEventListener('click', function(e) {
            if (e.target === modale || e.target.classList.contains('modal-image-container')) {
                fermerModale();
            }
        });
    </script>
</body>
</html>
