<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mewthology - Club Privé</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="scripts/assets/css/style.css?v=7">

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        /* ==========================================
           MÉCANIQUE DU SLIDER PLEIN ÉCRAN
        ========================================== */
        body.page-private {
            font-family: 'Montserrat', sans-serif;
            background-color: #000000;
            color: #ffffff;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        .slider-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }

        .slide {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease;
            display: flex;
            flex-direction: column;
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
            z-index: 10;
        }

        /* ==========================================
           DESIGN DE L'ANTICHAMBRE (SLIDE 1)
        ========================================== */
        #slide-1 { background-color: #000; }

        .ui-layer {
            position: absolute;
            inset: 0;
            z-index: 5;
            display: flex;
            align-items: center;
        }

        .hero-content {
            position: relative;
            z-index: 10;
            padding: 0 10vw;
            max-width: 50vw;
            pointer-events: none;
        }

        .massive-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(2.5rem, 6vw, 5.5rem);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
            background: linear-gradient(180deg, #9b87b0 0%, #6f548f 50%, #462c66 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8));
        }

        .hub-subtitle {
            font-size: clamp(0.7rem, 1.2vw, 1rem);
            color: #bfa3ed;
            letter-spacing: 6px;
            text-transform: uppercase;
            font-weight: 400;
            margin-top: 15px;
            border-left: 2px solid #a76cf2;
            padding-left: 15px;
            opacity: 0.9;
        }

        .hotesse-container {
            position: absolute;
            top: 58%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 85vh;
            width: auto;
            z-index: 10;
            cursor: pointer;
            pointer-events: auto;
        }

        .model-character {
            height: 100%;
            width: auto;
            object-fit: contain;
            object-position: center;
            filter: drop-shadow(-10px 10px 30px rgba(0,0,0,0.65)) contrast(1.02) saturate(1.05) brightness(0.95);
            transition: filter 0.5s ease;
        }

        .hotesse-container:hover .model-character {
            filter: drop-shadow(-12px 15px 40px rgba(0,0,0,0.85)) contrast(1.1) saturate(1.1) brightness(1.1);
        }

        /* ==========================================
           COUCHE VIDÉO DE TRANSITION
        ========================================== */
        .video-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            background-color: #000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .video-container.playing {
            opacity: 1;
            pointer-events: auto;
        }

        .video-container.fade-out {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ==========================================
           DESIGN DE LA GALERIE (SLIDE 2) - MUR COMPLET
        ========================================== */
        .slide-gallery {
            background-color: #030105;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            align-items: center;
            justify-content: flex-start;
            padding: 20px 20px 110px;
        }

        .slide-gallery header.header-main {
            padding: 15px 20px 10px !important;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Bouton Flou ON / OFF */
        .blur-toggle-btn {
            margin-top: 14px;
            background: rgba(167, 108, 242, 0.14);
            border: 1px solid rgba(167, 108, 242, 0.55);
            color: #e9d5ff;
            padding: 7px 18px;
            border-radius: 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s ease;
            backdrop-filter: blur(6px);
        }

        .blur-toggle-btn:hover {
            background: rgba(167, 108, 242, 0.28);
            border-color: #a76cf2;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(167, 108, 242, 0.35);
        }

        .blur-toggle-btn.off {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.18);
            color: #94a3b8;
        }

        .slide-gallery .collection-workspace {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            padding: 15px 0 0 !important;
            display: block;
        }

        .slide-gallery .cards-grid {
            display: grid !important;
            grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)) !important;
            gap: 16px !important;
            width: 100% !important;
            max-width: 1280px !important;
            padding: 10px 0 !important;
            margin: 0 auto !important;
        }

        .card-fullart {
            width: 100%;
            aspect-ratio: 63 / 88;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            background: #0d0814;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
            transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.25s ease, border-color 0.25s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 12px 10px;
        }

        .card-fullart img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            transition: transform 0.45s ease, filter 0.45s ease;
        }

        /* État Flou ON (par défaut) */
        .slide-gallery.blur-enabled .card-fullart img {
            filter: blur(15px) brightness(0.6);
            transform: scale(1.1);
        }

        .slide-gallery.blur-enabled .card-fullart:hover img {
            filter: blur(0px) brightness(1);
            transform: scale(1.04);
        }

        /* État Flou OFF */
        .slide-gallery.blur-disabled .card-fullart img {
            filter: none;
            transform: scale(1);
        }

        .slide-gallery.blur-disabled .card-fullart:hover img {
            transform: scale(1.05);
        }

        .card-fullart::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.94) 0%, rgba(0, 0, 0, 0.35) 38%, transparent 100%);
            z-index: 2;
            pointer-events: none;
        }

        .card-fullart:hover {
            transform: translateY(-6px);
            border-color: #a76cf2;
            box-shadow: 0 14px 28px rgba(101, 44, 160, 0.5);
        }

        .count-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 4;
            background: rgba(10, 5, 20, 0.85);
            border: 1px solid #a76cf2;
            color: #d8b4fe;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
        }

        .fullart-content {
            position: relative;
            z-index: 3;
            transform: translateY(2px);
            transition: transform 0.3s ease;
        }

        .card-fullart:hover .fullart-content {
            transform: translateY(0);
        }

        .fullart-title {
            font-family: 'Cinzel', serif;
            font-size: 1.05rem;
            color: #fff;
            text-shadow: 0 3px 10px rgba(0, 0, 0, 1);
            line-height: 1.15;
            margin-bottom: 2px;
        }

        .fullart-subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.55rem;
            color: #a76cf2;
            letter-spacing: 1.5px;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* ==========================================
           LA MODALE (POP-UP ZOOM)
        ========================================== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            overflow: hidden;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-close {
            position: absolute;
            top: 25px;
            right: 30px;
            color: #fff;
            font-size: 3rem;
            font-weight: 300;
            cursor: pointer;
            transition: transform 0.3s ease, color 0.3s ease;
            z-index: 10000;
            font-family: 'Montserrat', sans-serif;
            line-height: 1;
        }

        .modal-close:hover {
            transform: scale(1.2);
            color: #a76cf2;
        }

        .modal-image-container {
            position: relative;
            width: 90vw;
            height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
        }

        .modal-main-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            border: none;
            cursor: zoom-in;
            will-change: transform;
            transform-origin: center center;
            transition: transform 0.3s ease;
        }

        .modal-main-img.grab { cursor: grab; }
        .modal-main-img.grabbing { cursor: grabbing; }

        .modal-thumbnails {
            display: none;
            gap: 15px;
            margin-top: 15px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 90vw;
            z-index: 10001;
        }

        .thumb {
            width: 50px;
            height: 50px;
            border-radius: 6px;
            object-fit: cover;
            cursor: pointer;
            opacity: 0.65;
            transition: all 0.3s ease;
        }

        .thumb.active {
            border: 2px solid #a76cf2;
            box-shadow: 0 0 15px rgba(101, 44, 160, 0.5);
            opacity: 1;
        }

        /* ==========================================
           RESPONSIVE MOBILE
        ========================================== */
        @media (max-width: 768px) {
            #slide-1 { display: block; position: relative; }
            .hero-content {
                position: absolute;
                top: 0; left: 0;
                width: 100%; height: 100%;
                padding: 0 5vw;
                align-items: flex-start;
                justify-content: center;
                z-index: 10;
            }
            .massive-title { font-size: clamp(2rem, 10vw, 3rem); text-align: left; margin-bottom: 0; }
            .hotesse-container {
                top: 58% !important;
                left: 50% !important;
                transform: translate(-50%, -50%) !important;
                right: auto !important;
                width: 100vw;
                height: 80dvh;
                display: flex;
                justify-content: center;
            }
            .model-character { height: 100%; width: auto; object-fit: contain; object-position: center; }

            .slide-gallery { padding: 12px 12px 100px; }
            .slide-gallery header.header-main { padding: 12px 10px 8px !important; }
            .slide-gallery header.header-main h2 { font-size: 1.5rem !important; letter-spacing: 2px !important; }
            .slide-gallery header.header-main p { font-size: 0.65rem !important; letter-spacing: 1.5px !important; }

            .slide-gallery .cards-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
                gap: 10px !important;
                padding: 8px 0 !important;
            }

            .card-fullart { padding: 10px 8px; }
            .fullart-title { font-size: 0.95rem; }
            .fullart-subtitle { font-size: 0.52rem; }

            .modal-close { top: 15px; right: 20px; font-size: 2.2rem; }
            .modal-thumbnails { gap: 8px; margin-top: 15px; }
            .thumb { width: 40px; height: 40px; }
        }

        @media (max-width: 480px) {
            .massive-title { font-size: 2.5rem; }
        }
    </style>
</head>

<body class="theme-mew page-private">

    <div class="slider-container">
        <!-- SLIDE 1 : ACCUEIL -->
        <div id="slide-1" class="slide active">
            <img src="scripts/assets/img/bg-boudoir.jpg" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1;" alt="Décor du Club">
            <div class="ui-layer">
                <div class="hero-content">
                    <h1 class="massive-title">
                        <span style="display:block;">CLUB</span>
                        <span style="display:block;" class="highlight">PRIVÉ</span>
                    </h1>
                    <div class="hub-subtitle">Accès réservé aux membres</div>
                </div>
                <div class="hotesse-container" onclick="lancerVideo()" title="Entrer">
                    <img src="./assets/cards/dresseuses/lulud.png" alt="Ludvina" class="model-character" onerror="this.src='lulud.png'">
                </div>
            </div>
        </div>

        <!-- SLIDE 2 : GALERIE MUR COMPLET -->
        <div id="slide-2" class="slide slide-gallery blur-enabled">
            <header class="header-main" style="text-align: center;">
                <h2 style="font-family: 'Cinzel', serif; font-size: 2.4rem; color: #fff; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 2px;">
                    Archives Privées
                </h2>
                <p style="color: #a76cf2; font-weight: bold; letter-spacing: 2px; font-family: 'Montserrat', sans-serif; font-size: 0.8rem;">
                    L'ÉLITE DES DRESSEUSES
                </p>
                <button type="button" id="btn-blur-toggle" class="blur-toggle-btn" onclick="toggleGalleryBlur()">
                    Flou : ON
                </button>
            </header>

            <main class="collection-workspace">
                <div class="cards-grid" id="private-secret-grid"></div>
            </main>
        </div>

        <!-- COUCHE VIDÉO DE TRANSITION -->
        <div class="video-container" id="intro-video-container">
            <video id="intro-video" muted playsinline disablePictureInPicture>
                <source src="scripts/assets/video/intro-mobile.mp4" type="video/mp4" media="(max-width: 768px)">
                <source src="scripts/assets/video/intro-desktop.mp4" type="video/mp4">
            </video>
        </div>
    </div>

    <!-- LA MODALE -->
    <div id="modal-zoom" class="modal-overlay">
        <span class="modal-close" onclick="fermerModale()">×</span>
        <div class="modal-image-container">
            <img id="image-principale" class="modal-main-img" src="" alt="Vue détaillée">
        </div>
        <div class="modal-thumbnails" id="piste-miniatures"></div>
    </div>

    <!-- BARRE DE NAVIGATION DU SALON PRIVÉ -->
    <div class="floating-dock">
        <a href="index.html" class="dock-btn" title="Verrouiller et Quitter" style="color: #a76cf2; border-color: rgba(167, 108, 242, 0.4);">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0"></path>
            </svg>
        </a>
    </div>

    <script src="scripts/assets/js/dresseuses-data.js"></script>
    <script src="scripts/assets/js/script.js"></script>

    <script>
        // ==========================================
        // 1. GESTION DE LA VIDÉO ET DE LA TRANSITION
        // ==========================================
        const video = document.getElementById('intro-video');
        const videoContainer = document.getElementById('intro-video-container');
        const slide1 = document.getElementById('slide-1');
        const slide2 = document.getElementById('slide-2');
        let isTransitioning = false;
        const FADE_OFFSET = 0.4;

        function lancerVideo() {
            videoContainer.classList.remove('fade-out');
            videoContainer.classList.add('playing');
            video.currentTime = 0;
            video.play();
            isTransitioning = false;
        }

        video.addEventListener('timeupdate', () => {
            if (!isTransitioning && video.duration > 0 && (video.duration - video.currentTime) <= FADE_OFFSET) {
                triggerTransition();
            }
        });

        video.addEventListener('ended', () => {
            if (!isTransitioning) triggerTransition();
        });

        function triggerTransition() {
            isTransitioning = true;
            videoContainer.classList.remove('playing');
            videoContainer.classList.add('fade-out');
            slide1.classList.remove('active');
            slide2.classList.add('active');
            setTimeout(() => { video.pause(); }, 1000);
        }

        // ==========================================
        // 2. BASCULE FLOU ON / OFF
        // ==========================================
        function toggleGalleryBlur() {
            const btn = document.getElementById('btn-blur-toggle');
            const isBlurred = slide2.classList.contains('blur-enabled');

            slide2.classList.toggle('blur-enabled', !isBlurred);
            slide2.classList.toggle('blur-disabled', isBlurred);

            btn.textContent = isBlurred ? 'Flou : OFF' : 'Flou : ON';
            btn.classList.toggle('off', isBlurred);
        }

        // ==========================================
        // 3. GÉNÉRATION DU MUR COMPLET (STYLE 1)
        // ==========================================
        function renderPrivateGallery() {
            const gridContainer = document.getElementById('private-secret-grid');
            if (!gridContainer || typeof REGISTRE_SECRET === 'undefined') return;

            let htmlContent = '';

            for (const [trainerName, secretImages] of Object.entries(REGISTRE_SECRET)) {
                if (!secretImages || secretImages.length === 0) continue;

                const coverImgSrc = `./assets/cards/dresseuses/${secretImages[0]}`;
                const safeName = trainerName.replace(/'/g, "\\'");
                const badgeHTML = secretImages.length > 1
                    ? `<span class="count-badge">×${secretImages.length}</span>`
                    : '';

                htmlContent += `
                    <div class="card-fullart" onclick="ouvrirModale('${safeName}')">
                        ${badgeHTML}
                        <img src="${coverImgSrc}" alt="${trainerName}" loading="lazy" onerror="this.src='scripts/assets/img/back-fr.png'">
                        <div class="fullart-content">
                            <div class="fullart-title">${trainerName}</div>
                            <div class="fullart-subtitle">Édition Secrète</div>
                        </div>
                    </div>
                `;
            }

            if (typeof CARTES_ORPHELINES !== 'undefined' && CARTES_ORPHELINES.length > 0) {
                const badgeOrphelines = CARTES_ORPHELINES.length > 1
                    ? `<span class="count-badge">×${CARTES_ORPHELINES.length}</span>`
                    : '';

                htmlContent += `
                    <div class="card-fullart" style="border: 2px dashed rgba(167, 108, 242, 0.45);" onclick="ouvrirModaleOrphelines()">
                        ${badgeOrphelines}
                        <img src="scripts/assets/img/back-fr.png" alt="Inconnues" loading="lazy">
                        <div class="fullart-content">
                            <div class="fullart-title" style="color: #bfa3ed; letter-spacing: 4px;">? ? ?</div>
                            <div class="fullart-subtitle">Dresseuses Inconnues</div>
                        </div>
                    </div>
                `;
            }

            gridContainer.innerHTML = htmlContent;
        }

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(renderPrivateGallery, 100);
        });

        // ==========================================
        // 4. GESTION DE LA MODALE & RÉINITIALISATION DU ZOOM
        // ==========================================
        const modale = document.getElementById('modal-zoom');
        const imgPrincipale = document.getElementById('image-principale');
        const pisteMiniatures = document.getElementById('piste-miniatures');

        let currentScale = 1;
        let translateX = 0, translateY = 0;
        let startX, startY;
        let isDragging = false, hasMoved = false;
        let initialDistance = 0;

        function updateTransform(smooth = false) {
            imgPrincipale.style.transition = smooth ? 'transform 0.3s ease' : 'none';
            imgPrincipale.style.transform = `translate(${translateX}px, ${translateY}px) scale(${currentScale})`;
        }

        function resetZoom() {
            currentScale = 1;
            translateX = 0;
            translateY = 0;
            isDragging = false;
            hasMoved = false;
            imgPrincipale.classList.remove('grab', 'grabbing');
            updateTransform(true);
        }

        function ouvrirModale(trainerName) {
            resetZoom();
            const secretImages = REGISTRE_SECRET[trainerName];
            if (!secretImages || secretImages.length === 0) return;

            imgPrincipale.src = `./assets/cards/dresseuses/${secretImages[0]}`;

            if (secretImages.length > 1) {
                let thumbsHTML = '';
                secretImages.forEach((imgFile, index) => {
                    const thumbSrc = `./assets/cards/dresseuses/${imgFile}`;
                    const activeClass = index === 0 ? 'active' : '';
                    thumbsHTML += `<img src="${thumbSrc}" class="thumb ${activeClass}" alt="${trainerName} ${index + 1}" onclick="changerImageModale(event, '${thumbSrc}', this)">`;
                });
                pisteMiniatures.innerHTML = thumbsHTML;
                pisteMiniatures.style.display = 'flex';
            } else {
                pisteMiniatures.innerHTML = '';
                pisteMiniatures.style.display = 'none';
            }
            modale.classList.add('active');
        }

        function ouvrirModaleOrphelines() {
            resetZoom();
            if (typeof CARTES_ORPHELINES === 'undefined' || CARTES_ORPHELINES.length === 0) return;

            imgPrincipale.src = `./assets/cards/dresseuses/${CARTES_ORPHELINES[0]}`;

            if (CARTES_ORPHELINES.length > 1) {
                let thumbsHTML = '';
                CARTES_ORPHELINES.forEach((imgFile, index) => {
                    const thumbSrc = `./assets/cards/dresseuses/${imgFile}`;
                    const activeClass = index === 0 ? 'active' : '';
                    thumbsHTML += `<img src="${thumbSrc}" class="thumb ${activeClass}" alt="Inconnue ${index + 1}" onclick="changerImageModale(event, '${thumbSrc}', this)">`;
                });
                pisteMiniatures.innerHTML = thumbsHTML;
                pisteMiniatures.style.display = 'flex';
            } else {
                pisteMiniatures.innerHTML = '';
                pisteMiniatures.style.display = 'none';
            }
            modale.classList.add('active');
        }

        function changerImageModale(event, src, thumbElement) {
            event.stopPropagation();
            resetZoom();
            imgPrincipale.src = src;
            document.querySelectorAll('.modal-thumbnails .thumb').forEach(t => t.classList.remove('active'));
            thumbElement.classList.add('active');
        }

        function fermerModale() {
            resetZoom();
            modale.classList.remove('active');
            setTimeout(() => {
                if (!modale.classList.contains('active')) {
                    imgPrincipale.src = '';
                    pisteMiniatures.innerHTML = '';
                }
            }, 400);
        }

        modale.addEventListener('click', function(e) {
            if (e.target === modale || e.target.classList.contains('modal-image-container')) {
                fermerModale();
            }
        });

        // ==========================================
        // 5. GESTION DU ZOOM ET DÉPLACEMENT
        // ==========================================
        imgPrincipale.addEventListener('click', function(e) {
            if (window.innerWidth <= 768) return;
            if (hasMoved) return;

            if (currentScale > 1) {
                resetZoom();
            } else {
                currentScale = 2.5;
                translateX = 0;
                translateY = 0;
                imgPrincipale.classList.add('grab');
                updateTransform(true);
            }
        });

        function dragStart(e) {
            if (e.type === 'touchstart' && e.touches.length === 2) {
                initialDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                return;
            }
            if (currentScale <= 1) return;
            isDragging = true;
            hasMoved = false;
            imgPrincipale.classList.replace('grab', 'grabbing');
            if (e.type === 'touchstart') {
                startX = e.touches[0].clientX - translateX;
                startY = e.touches[0].clientY - translateY;
            } else {
                e.preventDefault();
                startX = e.clientX - translateX;
                startY = e.clientY - translateY;
            }
        }

        function drag(e) {
            if (e.type === 'touchmove' && e.touches.length === 2) {
                e.preventDefault();
                const currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const scaleMod = currentDist / initialDistance;
                currentScale = Math.min(Math.max(1, currentScale * scaleMod), 4);
                initialDistance = currentDist;
                imgPrincipale.classList.add('grab');
                updateTransform(false);
                return;
            }
            if (!isDragging) return;
            e.preventDefault();
            hasMoved = true;
            if (e.type === 'touchmove') {
                translateX = e.touches[0].clientX - startX;
                translateY = e.touches[0].clientY - startY;
            } else {
                translateX = e.clientX - startX;
                translateY = e.clientY - startY;
            }
            updateTransform(false);
        }

        function dragEnd() {
            if (!isDragging) return;
            isDragging = false;
            if (currentScale > 1) {
                imgPrincipale.classList.replace('grabbing', 'grab');
            }
        }

        imgPrincipale.addEventListener('mousedown', dragStart);
        imgPrincipale.addEventListener('touchstart', dragStart, { passive: false });
        window.addEventListener('mousemove', drag);
        window.addEventListener('touchmove', drag, { passive: false });
        window.addEventListener('mouseup', dragEnd);
        window.addEventListener('touchend', dragEnd);
    </script>
</body>
