<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mewthology — Master Set Forces Temporelles</title>
    
    <!-- PWA & Métadonnées -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0a0e17">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mewthology">
    
    <link rel="stylesheet" href="./scripts/assets/css/style.css">
    
    <!-- SDKs Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<!-- AJOUT : La classe page-masterset qui rend le bouton Édition visible -->
<body class="theme-masterset page-masterset">

    <header class="header-main">
        <h1>Master Set EV 5</h1>
        <p class="subtitle">Forces Temporelles</p>
        
        <!-- Jauge de progression sous le titre -->
        <div class="master-header-progress">
            <div class="master-progress-bar">
                <div class="master-progress-fill" id="master-progress-fill"></div>
            </div>
            <div class="master-progress-stats" id="master-progress-text">0 / 363 CARTES • 0%</div>
        </div>
    </header>

    <main class="collection-container">
        <!-- Grille du classeur -->
        <div class="cards-grid" id="master-grid"></div>
    </main>

    <!-- ==========================================
         BARRE DE NAVIGATION FLOTTANTE (DOCK)
    ========================================== -->
    <div class="floating-dock">
        <!-- Bouton Home (Toujours visible ici) -->
        <a href="index.html" id="btn-home" class="dock-btn" title="Accueil">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        </a>

        <!-- Bouton Édition (Rendu visible par .page-masterset) -->
        <div id="btn-edit" class="dock-btn" title="Mode Édition">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
        </div>

        <!-- Bouton To Top -->
        <div id="btn-to-top" class="dock-btn" title="Retour en haut" onclick="window.scrollTo({top:0, behavior:'smooth'})">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;">
                <polyline points="18 15 12 9 6 15"></polyline>
            </svg>
        </div>
    </div>

    <!-- 1. Ton moteur principal (initialise Firebase et connecte Firestore) -->
    <script src="./scripts/assets/js/script.js"></script>

    <!-- 2. La logique Master Set EV05 -->
    <script src="./scripts/assets/js/master-set.js"></script>
</body>
</html>
