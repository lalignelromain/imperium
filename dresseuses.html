<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mewthology - Panthéon des Dresseuses</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050608">
    
    <link rel="stylesheet" href="scripts/assets/css/style.css?v=2">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<!-- AJOUT : La classe page-dresseuses pour la gestion intelligente de la navbar -->
<body class="theme-mew page-dresseuses">
    <!-- Filigrane -->
    <img src="scripts/assets/img/mew-icon.png" class="bg-watermark bg-mew" alt="">
    
    <header class="header-main">
        <h1>DRESSEUSES</h1>
        <div class="subtitle">Illustrations Spéciales</div>
    </header>

    <main class="collection-workspace" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
        
        <!-- NOUVELLE ÉTAGÈRE (GRILLE 5x2) -->
        <div class="hub-grid" id="shelf">
            <!-- Les pochettes des dresseuses seront générées ici par script.js -->
        </div>

        <!-- CONTENEUR POUR LA PAGINATION -->
        <div class="pagination" id="dresseuses-pagination" style="display: flex; gap: 20px; margin-top: 30px; justify-content: center; width: 100%;">
            <!-- Les boutons Précédent/Suivant y seront injectés -->
        </div>

    </main>

    <!-- ==========================================
         BARRE DE NAVIGATION FLOTTANTE (DOCK)
    ========================================== -->
    <div class="floating-dock">
        <!-- Bouton Home (Toujours visible ici) -->
        <a href="index.html" id="btn-home" class="dock-btn" title="Accueil">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        </a>

        <!-- Bouton Édition (Masqué ici par le CSS de .page-dresseuses) -->
        <div id="btn-edit" class="dock-btn" title="Mode Édition">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
        </div>

        <!-- Bouton To Top (Retour en haut) -->
        <div id="btn-to-top" class="dock-btn" title="Retour en haut" onclick="window.scrollTo({top:0, behavior:'smooth'})">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;">
                <polyline points="18 15 12 9 6 15"></polyline>
            </svg>
        </div>
    </div>

    <script src="scripts/assets/js/dresseuses-data.js"></script>
    <script src="scripts/assets/js/script.js"></script>
</body>
</html>
