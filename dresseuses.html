<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mewthology - Panthéon des Dresseuses</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050608">
    
    <link rel="stylesheet" href="scripts/assets/css/style.css?v=2">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="theme-mew">
    <!-- Filigrane -->
    <img src="scripts/assets/img/mew-icon.png" class="bg-watermark bg-mew" alt="">
    
    <header class="header-main">
        <h1>DRESSEUSES</h1>
        <div class="subtitle">Illustrations Spéciales</div>
    </header>

    <main class="collection-workspace" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
        
        <!-- NOUVELLE ÉTAGÈRE (GRILLE 5x2) -->
        <div class="hub-grid" id="shelf">
            <!-- Les pochettes des dresseuses seront générées ici par script.js -->
        </div>

        <!-- CONTENEUR POUR LA PAGINATION -->
        <div class="pagination" id="dresseuses-pagination" style="display: flex; gap: 20px; margin-top: 30px; justify-content: center; width: 100%;">
            <!-- Les boutons Précédent/Suivant y seront injectés -->
        </div>

    </main>

    <!-- Bouton FAB Privé (Géré automatiquement par script.js via Firebase) -->
    <a href="dresseuses-private.html" id="fabPrivateBtn" class="fab-private-btn" title="Espace Privé Dresseuses">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
    </a>

    <script src="scripts/assets/js/dresseuses-data.js"></script>
    <script src="scripts/assets/js/script.js"></script>
</body>
</html>
