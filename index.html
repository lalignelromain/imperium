    <!-- STYLE DE L'ANIMATION ULTIME -->
    <style>
        /* ==========================================
           1. CORRECTION DE L'ESPACE SOUS LE TITRE
        ========================================== */
        .page-index .header-main {
            padding-bottom: 0px !important;
            margin-bottom: 5px !important;
        }
        .page-index .header-main h1 {
            margin-bottom: 0 !important;
            line-height: 1.1;
        }
        .page-index .header-main .subtitle {
            margin-top: 5px !important;
            margin-bottom: 15px !important;
        }
        .page-index .hub-container {
            padding-top: 0px !important;
        }

        /* ==========================================
           2. ÉCRAN D'INTRODUCTION (EFFET TCG POCKET)
        ========================================== */
        #intro-sequence {
            position: fixed;
            inset: 0;
            background-color: #050608;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 1.2s ease-in-out, visibility 1.2s;
            overflow: hidden;
            perspective: 1000px; /* Donne de la profondeur 3D */
        }

        /* Aura psychique globale */
        .intro-bg-glow {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(167, 108, 242, 0.15) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }
        .intro-bg-glow.active {
            opacity: 1;
            animation: pulseGlow 4s infinite alternate;
        }
        @keyframes pulseGlow {
            0% { transform: scale(0.8); background: radial-gradient(circle at center, rgba(255, 153, 204, 0.15) 0%, transparent 70%); }
            100% { transform: scale(1.2); background: radial-gradient(circle at center, rgba(167, 108, 242, 0.3) 0%, transparent 70%); }
        }

        /* Base pour les Sprites */
        .intro-sprite {
            position: absolute;
            max-height: 60vh;
            max-width: 80vw;
            object-fit: contain;
            opacity: 0;
            z-index: 5;
        }

        /* MEW : Entrée douce et onirique */
        #intro-mew {
            transform: scale(0.8) translateZ(-100px);
            filter: drop-shadow(0 0 0 rgba(255, 153, 204, 0)) blur(15px);
            transition: opacity 2s ease, transform 3s cubic-bezier(0.2, 0.8, 0.2, 1), filter 2s ease;
        }
        #intro-mew.active {
            opacity: 1;
            transform: scale(1) translateZ(0);
            filter: drop-shadow(0 10px 30px rgba(255, 153, 204, 0.6)) blur(0px);
            animation: floatMew 4s ease-in-out infinite alternate 2s;
        }

        /* ONDE DE CHOC PSYCHIQUE (Transition Mew -> Mewtwo) */
        .shockwave {
            position: absolute;
            top: 50%; left: 50%;
            width: 10px; height: 10px;
            background: transparent;
            border: 4px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(1);
            opacity: 0;
            z-index: 4;
            box-shadow: 0 0 50px #a76cf2, inset 0 0 50px #a76cf2;
            pointer-events: none;
        }
        .shockwave.explode {
            animation: psychicBlast 1s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
        }
        @keyframes psychicBlast {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; border-width: 30px; }
            100% { transform: translate(-50%, -50%) scale(150); opacity: 0; border-width: 1px; }
        }

        /* MEWTWO : Entrée fracassante et agressive */
        #intro-mewtwo {
            transform: scale(1.6) translateZ(200px); /* Arrive de très près */
            filter: drop-shadow(0 0 0 rgba(167, 108, 242, 0)) blur(20px) brightness(2);
            transition: opacity 0.5s ease-out, transform 0.8s cubic-bezier(0.1, 0.8, 0.3, 1), filter 0.8s ease-out;
        }
        #intro-mewtwo.active {
            opacity: 1;
            transform: scale(1.05) translateZ(0);
            filter: drop-shadow(0 15px 50px rgba(167, 108, 242, 1)) blur(0px) brightness(1);
            animation: floatMewtwo 3s ease-in-out infinite alternate 0.8s;
        }

        /* Animations de lévitation distinctes */
        @keyframes floatMew {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-15px) rotate(2deg); }
        }
        @keyframes floatMewtwo {
            0% { transform: translateY(0px) scale(1.05) rotate(0deg); filter: drop-shadow(0 15px 50px rgba(167, 108, 242, 1)); }
            100% { transform: translateY(-8px) scale(1.08) rotate(-1.5deg); filter: drop-shadow(0 25px 70px rgba(167, 108, 242, 0.8)); }
        }

        .hidden-intro {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none;
        }

        /* Bouton Skip */
        .skip-btn {
            position: absolute;
            bottom: 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(167, 108, 242, 0.3);
            color: rgba(255, 255, 255, 0.6);
            padding: 10px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 3px;
            font-size: 0.75rem;
            text-transform: uppercase;
            backdrop-filter: blur(5px);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 10;
        }
        .skip-btn:hover {
            color: #fff;
            border-color: #a76cf2;
            background: rgba(167, 108, 242, 0.4);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(101, 44, 160, 0.4);
        }
    </style>

    <!-- SCRIPT DU PASS VIP -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const triggerElement = document.getElementById('title-trainers');
            const vipPadlock = document.getElementById('vip-padlock');
            let pressTimer;
            let isLongPress = false; 

            if(triggerElement) triggerElement.setAttribute('draggable', 'false');

            function startPress(e) {
                isLongPress = false;
                pressTimer = window.setTimeout(() => {
                    isLongPress = true;
                    vipPadlock.classList.add('visible');
                    if (navigator.vibrate) navigator.vibrate(50);
                }, 800); 
            }

            function cancelPress() { clearTimeout(pressTimer); }

            if(triggerElement) {
                triggerElement.addEventListener('touchstart', startPress, { passive: true });
                triggerElement.addEventListener('touchend', cancelPress);
                triggerElement.addEventListener('touchmove', cancelPress);
                triggerElement.addEventListener('mousedown', startPress);
                triggerElement.addEventListener('mouseup', cancelPress);
                triggerElement.addEventListener('mouseleave', cancelPress);
                triggerElement.addEventListener('click', (e) => {
                    if(isLongPress) { e.preventDefault(); isLongPress = false; }
                });
            }

            document.addEventListener('click', (e) => {
                if (triggerElement && !triggerElement.contains(e.target) && !vipPadlock.contains(e.target)) {
                    vipPadlock.classList.remove('visible');
                }
            });

            if(vipPadlock) {
                vipPadlock.addEventListener('click', () => {
                    window.location.href = 'dresseuses-private.html';
                });
            }
        });
    </script>

    <!-- SCRIPT DE L'ANIMATION D'INTRODUCTION ULTIME -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const mew = document.getElementById("intro-mew");
            const mewtwo = document.getElementById("intro-mewtwo");
            const glow = document.getElementById("intro-glow");
            const shockwave = document.getElementById("shockwave");
            const introScreen = document.getElementById("intro-sequence");

            if(mew && mewtwo && introScreen) {
                // 1. Allumage de l'aura et apparition de Mew (douceur)
                setTimeout(() => {
                    if(glow) glow.classList.add("active");
                    mew.classList.add("active");
                }, 300);

                // 2. L'onde de choc et l'arrivée fracassante de Mewtwo
                setTimeout(() => {
                    if(shockwave) shockwave.classList.add("explode"); // Déclenche l'explosion
                    mew.classList.remove("active"); // Mew disparaît
                    mewtwo.classList.add("active"); // Mewtwo zoome agressivement
                }, 3800);

                // 3. Fin de l'intro (Disparition vers le menu)
                setTimeout(() => {
                    mewtwo.classList.remove("active");
                    if(glow) glow.classList.remove("active");
                    introScreen.classList.add("hidden-intro");
                }, 8000); // Rallongé légèrement pour apprécier Mewtwo
            }
        });

        function skipIntro() {
            const introScreen = document.getElementById("intro-sequence");
            if(introScreen) introScreen.classList.add("hidden-intro");
        }
    </script>
