    <!-- STYLE DE L'ANIMATION IMMERSIVE "TCG POCKET" -->
    <style>
        /* Ajustement de l'espace sous le titre */
        .page-index .header-main { padding-bottom: 0px !important; margin-bottom: 5px !important; }
        .page-index .header-main h1 { margin-bottom: 0 !important; line-height: 1.1; }
        .page-index .header-main .subtitle { margin-top: 5px !important; margin-bottom: 15px !important; }
        .page-index .hub-container { padding-top: 0px !important; }

        /* ==========================================
           CONTENEUR PRINCIPAL D'INTRODUCTION
        ========================================== */
        #intro-sequence {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #1a0b2e 0%, #050608 80%);
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 1s ease-in-out, visibility 1s;
            overflow: hidden;
            perspective: 1000px;
        }

        /* Tremblement de l'écran (Camera Shake) */
        .camera-shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 2px, 0) rotate(-1deg); }
            20%, 80% { transform: translate3d(4px, -2px, 0) rotate(1deg); }
            30%, 50%, 70% { transform: translate3d(-6px, 4px, 0) rotate(-2deg); }
            40%, 60% { transform: translate3d(6px, -4px, 0) rotate(2deg); }
        }

        /* Flash d'explosion blanc */
        #flash-overlay {
            position: absolute;
            inset: 0;
            background: #ffffff;
            opacity: 0;
            z-index: 20;
            pointer-events: none;
        }
        .flash-active {
            animation: psychicFlash 1.5s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
        }
        @keyframes psychicFlash {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* ==========================================
           SYSTÈME DE PARTICULES (AURA)
        ========================================== */
        #intro-particles {
            position: absolute;
            inset: 0;
            z-index: 2;
        }
        .particle {
            position: absolute;
            background: #ff99cc;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff99cc, 0 0 20px #ff99cc;
            opacity: 0;
            pointer-events: none;
            animation: floatUp 4s infinite linear;
        }
        /* Mode Mewtwo (violet, plus rapide, plus intense) */
        .mewtwo-phase .particle {
            background: #a76cf2;
            box-shadow: 0 0 15px #a76cf2, 0 0 30px #652ca0;
            animation: floatUpAggressive 1.5s infinite linear;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.6; }
            100% { transform: translateY(-20vh) scale(1.5); opacity: 0; }
        }
        @keyframes floatUpAggressive {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-50vh) scale(2.5); opacity: 0; }
        }

        /* ==========================================
           SPRITES (LES PERSONNAGES)
        ========================================== */
        .intro-sprite {
            position: absolute;
            max-height: 65vh;
            max-width: 85vw;
            object-fit: contain;
            opacity: 0;
            z-index: 10;
        }

        /* MEW : Douceur et lévitation onirique */
        #intro-mew {
            transform: scale(0.9) translateZ(-50px);
            filter: drop-shadow(0 0 30px rgba(255, 153, 204, 0.4));
            transition: opacity 2s ease, transform 3s ease-out;
        }
        #intro-mew.active {
            opacity: 1;
            transform: scale(1) translateZ(0);
            animation: floatMew 4s ease-in-out infinite alternate 1s;
        }

        /* MEWTWO : Zoom agressif depuis le fond */
        #intro-mewtwo {
            transform: scale(0.2) translateZ(-300px); /* Part de très loin */
            filter: drop-shadow(0 0 50px rgba(167, 108, 242, 1)) brightness(2);
            transition: opacity 0.2s, transform 0.6s cubic-bezier(0.1, 0.8, 0.2, 1.2), filter 0.8s;
        }
        #intro-mewtwo.active {
            opacity: 1;
            transform: scale(1.1) translateZ(0); /* Arrive fort en premier plan */
            filter: drop-shadow(0 20px 60px rgba(101, 44, 160, 0.9)) brightness(1);
            animation: floatMewtwo 2.5s ease-in-out infinite alternate 0.6s;
        }

        @keyframes floatMew {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-15px) rotate(2deg); }
        }
        @keyframes floatMewtwo {
            0% { transform: translateY(0px) scale(1.1) rotate(-1deg); }
            100% { transform: translateY(-10px) scale(1.12) rotate(1deg); }
        }

        .hidden-intro {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none;
        }

        /* Bouton Skip */
        .skip-btn {
            position: absolute;
            bottom: 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(167, 108, 242, 0.3);
            color: rgba(255, 255, 255, 0.6);
            padding: 10px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 3px;
            font-size: 0.75rem;
            text-transform: uppercase;
            backdrop-filter: blur(5px);
            transition: all 0.4s ease;
            z-index: 30;
        }
        .skip-btn:hover {
            color: #fff;
            border-color: #a76cf2;
            background: rgba(167, 108, 242, 0.4);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 20px rgba(101, 44, 160, 0.4);
        }
    </style>

    <!-- SCRIPT DU PASS VIP -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const triggerElement = document.getElementById('title-trainers');
            const vipPadlock = document.getElementById('vip-padlock');
            let pressTimer;
            let isLongPress = false; 

            if(triggerElement) triggerElement.setAttribute('draggable', 'false');

            function startPress(e) {
                isLongPress = false;
                pressTimer = window.setTimeout(() => {
                    isLongPress = true;
                    vipPadlock.classList.add('visible');
                    if (navigator.vibrate) navigator.vibrate(50);
                }, 800); 
            }

            function cancelPress() { clearTimeout(pressTimer); }

            if(triggerElement) {
                triggerElement.addEventListener('touchstart', startPress, { passive: true });
                triggerElement.addEventListener('touchend', cancelPress);
                triggerElement.addEventListener('touchmove', cancelPress);
                triggerElement.addEventListener('mousedown', startPress);
                triggerElement.addEventListener('mouseup', cancelPress);
                triggerElement.addEventListener('mouseleave', cancelPress);
                triggerElement.addEventListener('click', (e) => {
                    if(isLongPress) { e.preventDefault(); isLongPress = false; }
                });
            }

            document.addEventListener('click', (e) => {
                if (triggerElement && !triggerElement.contains(e.target) && !vipPadlock.contains(e.target)) {
                    vipPadlock.classList.remove('visible');
                }
            });

            if(vipPadlock) {
                vipPadlock.addEventListener('click', () => {
                    window.location.href = 'dresseuses-private.html';
                });
            }
        });
    </script>

    <!-- SCRIPT DE L'ANIMATION IMMERSIVE -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const mew = document.getElementById("intro-mew");
            const mewtwo = document.getElementById("intro-mewtwo");
            const introScreen = document.getElementById("intro-sequence");
            const flash = document.getElementById("flash-overlay");
            const particlesContainer = document.getElementById("intro-particles");

            if(!introScreen) return;

            // 1. Génération des particules d'aura (30 orbes)
            for(let i = 0; i < 30; i++) {
                let p = document.createElement("div");
                p.classList.add("particle");
                p.style.left = Math.random() * 100 + "%";
                p.style.top = Math.random() * 100 + "%";
                p.style.animationDelay = (Math.random() * 4) + "s";
                let size = Math.random() * 4 + 2; // Taille entre 2px et 6px
                p.style.width = size + "px";
                p.style.height = size + "px";
                particlesContainer.appendChild(p);
            }

            // 2. Apparition de Mew au lancement
            setTimeout(() => {
                mew.classList.add("active");
            }, 300);

            // 3. L'anomalie : Tremblement de l'écran avant Mewtwo
            setTimeout(() => {
                introScreen.classList.add("camera-shake");
            }, 3800);

            // 4. Explosion psychique : Le Flash et l'apparition de Mewtwo
            setTimeout(() => {
                flash.classList.add("flash-active"); // Écran blanc
                introScreen.classList.remove("camera-shake");
                particlesContainer.classList.add("mewtwo-phase"); // Particules violettes rapides
                
                mew.classList.remove("active");
                mewtwo.classList.add("active"); // Mewtwo zoome agressivement depuis le fond
            }, 4300);

            // 5. Fin de la cinématique, accès au site
            setTimeout(() => {
                mewtwo.classList.remove("active");
                introScreen.classList.add("hidden-intro");
            }, 8500); // Laisse le temps de voir Mewtwo stabilisé
        });

        // Fonction pour le bouton "Passer l'intro"
        function skipIntro() {
            const introScreen = document.getElementById("intro-sequence");
            if(introScreen) introScreen.classList.add("hidden-intro");
        }
    </script>
