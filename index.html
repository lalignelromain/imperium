<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mewthology</title>

    <!-- PWA & Métadonnées Mobiles -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#050608">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mewthology">
    <link rel="apple-touch-icon" href="./favicon.png">
    <link rel="icon" type="image/png" href="./favicon.png">

    <!-- Feuilles de style -->
    <link rel="stylesheet" href="./scripts/assets/css/style.css">

    <!-- SDK Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- Filigranes d'arrière-plan interactifs -->
    <img src="./scripts/assets/img/mew.png" alt="Mew" class="bg-watermark bg-mew">
    <img src="./scripts/assets/img/mewtwo.png" alt="Mewtwo" class="bg-watermark bg-mewtwo">

    <!-- En-tête Principal -->
    <header class="header-main">
        <h1>Mewthology</h1>
        <p class="subtitle">Archives & Collections</p>
    </header>

    <!-- Hub de Navigation -->
    <main class="hub-container">
        <nav class="hub-grid" aria-label="Navigation principale">
            <!-- LIGNE 1 : ARCHIVES & PRESTIGE -->
            <a href="pokedex.html" class="hub-card pokedex-card">
                <h2>POKÉDEX</h2>
                <p>Quête Absolue</p>
            </a>
            <a href="pantheon.html" class="hub-card pantheon-card">
                <h2>PANTHÉON</h2>
                <p>Scellés & Gradées</p>
            </a>

            <!-- LIGNE 2 : COLLECTIONS THÉMATIQUES -->
            <a href="mew.html" class="hub-card mew-card">
                <h2>MEW</h2>
                <p>Origine</p>
            </a>
            <a href="mewtwo.html" class="hub-card mewtwo-card">
                <h2>MEWTWO</h2>
                <p>Puissance</p>
            </a>
            <a href="dresseuses.html" class="hub-card dresseuses-card" style="--th-color: #f472b6; --th-glow: rgba(244, 114, 182, 0.45);">
                <h2>TRAINERS</h2>
                <p>Full Art</p>
            </a>

            <!-- LIGNE 3 : MASTER SET EV5 -->
            <a href="master-set.html" class="hub-card masterset-card">
                <div class="hub-card-content">
                    <h2>MASTER SET EV 5</h2>
                    <p>Forces Temporelles</p>
                </div>
                <div class="hub-progress-wrapper">
                    <div class="hub-progress-bar">
                        <div class="hub-progress-fill" id="ev5-hub-progress-fill"></div>
                    </div>
                    <span class="hub-progress-text" id="ev5-hub-progress-text">0 / 363 • 0%</span>
                </div>
            </a>

            <!-- LIGNE 4 : PIKACHU 30 ANS -->
            <a href="pikachu30.html" class="hub-card pikachu30-card masterset-card" style="--th-color: #facc15; --th-glow: rgba(250, 204, 21, 0.45);">
                <div class="hub-card-content">
                    <h2 style="background: linear-gradient(135deg, #fef08a 0%, #ca8a04 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">PIKACHU 30TH</h2>
                    <p>Set Commémoratif</p>
                </div>
                <div class="hub-progress-wrapper">
                    <div class="hub-progress-bar">
                        <div class="hub-progress-fill" id="pika30-hub-progress-fill" style="background: linear-gradient(90deg, #facc15, #f59e0b);"></div>
                    </div>
                    <span class="hub-progress-text" id="pika30-hub-progress-text">0 / 30 • 0%</span>
                </div>
            </a>
        </nav>
    </main>

    <!-- Moteur Principal -->
    <script src="./scripts/assets/js/script.js"></script>
</body>
</html>
