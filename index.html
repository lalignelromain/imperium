    <!-- ==========================================

                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        </a>

        <!-- Bouton Édition -->
        <div id="btn-edit" class="dock-btn" title="Mode Édition">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
        </div>

        <!-- Bouton To Top -->
        <div id="btn-to-top" class="dock-btn" title="Retour en haut" onclick="window.scrollTo({top:0, behavior:'smooth'})">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;">
                <polyline points="18 15 12 9 6 15"></polyline>
            </svg>
        </div>

        <!-- LE CADENAS DORÉ (DÉCONNEXION / Géré par le CSS) -->
        <div id="dock-btn-lock" class="dock-btn" title="Verrouiller (Déconnexion)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>

        <!-- LE CADENAS VIP SECRETS (Violet, Caché par défaut) -->
        <div id="vip-padlock" class="hidden-padlock" title="Accès Club Privé">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>
    </div>

    <!-- Moteur Principal -->
    <script src="./scripts/assets/js/pikachu-data.js"></script>
    <script src="./scripts/assets/js/script.js"></script>

   <!-- SCRIPT DU PASS VIP (APPUI LONG) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const triggerElement = document.getElementById('title-trainers');
            const vipPadlock = document.getElementById('vip-padlock');
            let pressTimer;
            let isLongPress = false; // Mémorise si on a fait un appui long

            // Empêcher l'image fantôme de s'afficher au drag
            if(triggerElement) triggerElement.setAttribute('draggable', 'false');

            function startPress(e) {
                isLongPress = false;
                pressTimer = window.setTimeout(() => {
                    isLongPress = true;
                    vipPadlock.classList.add('visible');
                    if (navigator.vibrate) navigator.vibrate(50);
                }, 800); 
            }

            function cancelPress() {
                clearTimeout(pressTimer);
            }

            if(triggerElement) {
                triggerElement.addEventListener('touchstart', startPress, { passive: true });
                triggerElement.addEventListener('touchend', cancelPress);
                triggerElement.addEventListener('touchmove', cancelPress);

                triggerElement.addEventListener('mousedown', startPress);
                triggerElement.addEventListener('mouseup', cancelPress);
                triggerElement.addEventListener('mouseleave', cancelPress);

                // La magie est ici : si c'est un appui long, on annule l'ouverture normale de la page
                triggerElement.addEventListener('click', (e) => {
                    if(isLongPress) {
                        e.preventDefault(); 
                        isLongPress = false;
                    }
                });
            }

            // Permet de cacher le cadenas mauve en cliquant n'importe où ailleurs
            document.addEventListener('click', (e) => {
                if (triggerElement && !triggerElement.contains(e.target) && !vipPadlock.contains(e.target)) {
                    vipPadlock.classList.remove('visible');
                }
            });

            if(vipPadlock) {
                vipPadlock.addEventListener('click', () => {
                    window.location.href = 'dresseuses-private.html';
                });
            }
        });
    </script>
</body>
</html>
