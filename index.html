<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mewthology</title>

    <!-- PWA & Métadonnées Mobiles -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#050608">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mewthology">
    <link rel="apple-touch-icon" href="./favicon.png">
    <link rel="icon" type="image/png" href="./favicon.png">

    <!-- Feuilles de style -->
    <link rel="stylesheet" href="./scripts/assets/css/style.css">

    <!-- STYLE AJUSTÉ : ANIMATION PREMIUM & CORRECTION DES ESPACEMENTS -->
    <style>
        /* ==========================================
           1. CORRECTION DE L'ESPACE SOUS LE TITRE
        ========================================== */
        .page-index .header-main {
            padding-bottom: 0px !important;
            margin-bottom: 5px !important;
        }
        .page-index .header-main h1 {
            margin-bottom: 0 !important;
            line-height: 1.1;
        }
        .page-index .header-main .subtitle {
            margin-top: 5px !important;
            margin-bottom: 15px !important; /* Ajuste cette valeur pour rapprocher les boutons */
        }
        .page-index .hub-container {
            padding-top: 0px !important; /* Remonte la grille des boutons */
        }

        /* ==========================================
           2. ÉCRAN D'INTRODUCTION (MEW & MEWTWO PREMIUM)
        ========================================== */
        #intro-sequence {
            position: fixed;
            inset: 0;
            background-color: #050608;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 1.2s ease-in-out, visibility 1.2s;
            overflow: hidden;
        }

        /* Aura psychique en arrière-plan */
        .intro-bg-glow {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(167, 108, 242, 0.25) 0%, transparent 65%);
            opacity: 0;
            transition: opacity 2s ease-in-out;
            transform: scale(0.8);
        }
        .intro-bg-glow.active {
            opacity: 1;
            transform: scale(1.2);
            transition: opacity 2s ease, transform 4s ease-out;
        }

        /* Base pour les Pokémon (Apparition type "Matérialisation") */
        .intro-sprite {
            position: absolute;
            max-height: 60vh;
            max-width: 80vw;
            object-fit: contain;
            opacity: 0;
            /* Effet de flou et de zoom arrière au départ */
            transform: scale(0.85) translateY(20px);
            filter: drop-shadow(0 0 0px rgba(167, 108, 242, 0)) blur(10px);
            transition: opacity 1.2s cubic-bezier(0.25, 1, 0.5, 1), 
                        transform 1.2s cubic-bezier(0.25, 1, 0.5, 1), 
                        filter 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 2;
        }

        /* Activation de Mew (Aura douce) */
        #intro-mew.active {
            opacity: 1;
            transform: scale(1) translateY(0);
            filter: drop-shadow(0 10px 25px rgba(255, 153, 204, 0.5)) blur(0px);
            animation: floatOrganic 4s ease-in-out infinite alternate 1.2s;
        }

        /* Activation de Mewtwo (Aura puissante) */
        #intro-mewtwo.active {
            opacity: 1;
            transform: scale(1.05) translateY(0);
            filter: drop-shadow(0 15px 40px rgba(167, 108, 242, 0.8)) blur(0px);
            animation: floatOrganicMewtwo 3.5s ease-in-out infinite alternate 1.2s;
        }

        /* Lévitation fluide avec légère rotation */
        @keyframes floatOrganic {
            0% { transform: translateY(0px) scale(1) rotate(0deg); }
            50% { transform: translateY(-15px) scale(1.02) rotate(1.5deg); }
            100% { transform: translateY(5px) scale(0.98) rotate(-1deg); }
        }

        @keyframes floatOrganicMewtwo {
            0% { transform: translateY(0px) scale(1.05) rotate(0deg); }
            50% { transform: translateY(-10px) scale(1.07) rotate(-1deg); filter: drop-shadow(0 15px 50px rgba(167, 108, 242, 1)); }
            100% { transform: translateY(10px) scale(1.03) rotate(1deg); }
        }

        .hidden-intro {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none;
        }

        /* Bouton Skip modernisé */
        .skip-btn {
            position: absolute;
            bottom: 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(167, 108, 242, 0.3);
            color: rgba(255, 255, 255, 0.6);
            padding: 10px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 3px;
            font-size: 0.75rem;
            text-transform: uppercase;
            backdrop-filter: blur(5px);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 10;
        }

        .skip-btn:hover {
            color: #fff;
            border-color: #a76cf2;
            background: rgba(167, 108, 242, 0.4);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(101, 44, 160, 0.4);
        }
    </style>

    <!-- SDK Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>

<body class="page-index">

    <!-- Moteur Principal -->
    <script src="./scripts/assets/js/pikachu-data.js"></script>
    <script src="./scripts/assets/js/script.js"></script>

    <!-- SCRIPT DU PASS VIP (APPUI LONG) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const triggerElement = document.getElementById('title-trainers');
            const vipPadlock = document.getElementById('vip-padlock');
            let pressTimer;
            let isLongPress = false; 

            if(triggerElement) triggerElement.setAttribute('draggable', 'false');

            function startPress(e) {
                isLongPress = false;
                pressTimer = window.setTimeout(() => {
                    isLongPress = true;
                    vipPadlock.classList.add('visible');
                    if (navigator.vibrate) navigator.vibrate(50);
                }, 800); 
            }

            function cancelPress() {
                clearTimeout(pressTimer);
            }

            if(triggerElement) {
                triggerElement.addEventListener('touchstart', startPress, { passive: true });
                triggerElement.addEventListener('touchend', cancelPress);
                triggerElement.addEventListener('touchmove', cancelPress);
                triggerElement.addEventListener('mousedown', startPress);
                triggerElement.addEventListener('mouseup', cancelPress);
                triggerElement.addEventListener('mouseleave', cancelPress);
                triggerElement.addEventListener('click', (e) => {
                    if(isLongPress) {
                        e.preventDefault(); 
                        isLongPress = false;
                    }
                });
            }

            document.addEventListener('click', (e) => {
                if (triggerElement && !triggerElement.contains(e.target) && !vipPadlock.contains(e.target)) {
                    vipPadlock.classList.remove('visible');
                }
            });

            if(vipPadlock) {
                vipPadlock.addEventListener('click', () => {
                    window.location.href = 'dresseuses-private.html';
                });
            }
        });
    </script>

    <!-- SCRIPT DE L'ANIMATION D'INTRODUCTION -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const mew = document.getElementById("intro-mew");
            const mewtwo = document.getElementById("intro-mewtwo");
            const glow = document.getElementById("intro-glow");
            const introScreen = document.getElementById("intro-sequence");

            if(mew && mewtwo && introScreen) {
                // 1. Allumage de l'aura psychique et apparition de Mew (matérialisation)
                setTimeout(() => {
                    if(glow) glow.classList.add("active");
                    mew.classList.add("active");
                }, 300);

                // 2. Transition vers Mewtwo (Fondu enchaîné)
                setTimeout(() => {
                    mew.classList.remove("active");
                    mewtwo.classList.add("active");
                }, 3800);

                // 3. Fin de l'intro (Disparition douce vers le site)
                setTimeout(() => {
                    mewtwo.classList.remove("active");
                    if(glow) glow.classList.remove("active");
                    introScreen.classList.add("hidden-intro");
                }, 7500);
            }
        });

        // Fonction pour le bouton "Passer l'intro"
        function skipIntro() {
            const introScreen = document.getElementById("intro-sequence");
            if(introScreen) {
                introScreen.classList.add("hidden-intro");
            }
        }
    </script>
</body>
