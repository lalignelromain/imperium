<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mewthology - Panthéon</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#050608">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mewthology">
    <link rel="apple-touch-icon" href="./favicon.png">
    <link rel="icon" type="image/png" href="./favicon.png">
    <link rel="stylesheet" href="./scripts/assets/css/style.css">
</head>
<body>
    <img src="./scripts/assets/img/mew.png" alt="" class="bg-watermark bg-mew">
    <img src="./scripts/assets/img/mewtwo.png" alt="" class="bg-watermark bg-mewtwo">

    <header class="header-main">
        <h1>Panthéon</h1>
    </header>

    <main class="collection-container">
        <section class="pantheon-section" style="margin-bottom: 40px;">
            <h2 style="border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px;">Items Scellés</h2>
            <div class="pantheon-grid" id="scelles-grid" style="display: flex; flex-wrap: wrap; gap: 20px;"></div>
        </section>

        <section class="pantheon-section">
            <h2 style="border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px;">Cartes Gradées</h2>
            <div class="pantheon-grid" id="gradees-grid" style="display: flex; flex-wrap: wrap; gap: 20px;"></div>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    
    <script src="./scripts/assets/js/pantheon-data.js"></script>
    <script src="./scripts/assets/js/script.js"></script>
</body>
</html>
