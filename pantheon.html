<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mewthology - Panthéon</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#050608">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mewthology">
    <link rel="apple-touch-icon" href="./favicon.png">
    <link rel="icon" type="image/png" href="./favicon.png">
    <link rel="stylesheet" href="./scripts/assets/css/style.css">
</head>
<!-- AJOUT : La classe page-pantheon maintient le bouton Édition caché -->
<body class="page-pantheon">
    <img src="./scripts/assets/img/mew.png" alt="" class="bg-watermark bg-mew">
    <img src="./scripts/assets/img/mewtwo.png" alt="" class="bg-watermark bg-mewtwo">

    <header class="header-main">
        <h1>Panthéon</h1>
        <div class="subtitle">Reliques & Cartes Gradées</div>
    </header>

    <main class="pantheon-container">
        <section class="pantheon-section">
            <h2 class="category-title">Items Scellés</h2>
            <!-- Le conteneur prêt pour la génération dynamique -->
            <div class="layout-catalogue" id="scelles-grid"></div>
        </section>

        <section class="pantheon-section">
            <h2 class="category-title">Cartes Gradées</h2>
            <!-- Le conteneur prêt pour la génération dynamique -->
            <div class="layout-catalogue" id="gradees-grid"></div>
        </section>
    </main>

    <!-- ==========================================
         BARRE DE NAVIGATION FLOTTANTE (DOCK)
    ========================================== -->
    <div class="floating-dock">
        <!-- Bouton Home (Toujours visible ici) -->
        <a href="index.html" id="btn-home" class="dock-btn" title="Accueil">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        </a>

        <!-- Bouton Édition (Masqué par le CSS de .page-pantheon) -->
        <div id="btn-edit" class="dock-btn" title="Mode Édition">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
        </div>

        <!-- Bouton To Top -->
        <div id="btn-to-top" class="dock-btn" title="Retour en haut" onclick="window.scrollTo({top:0, behavior:'smooth'})">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;">
                <polyline points="18 15 12 9 6 15"></polyline>
            </svg>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    
    <script src="./scripts/assets/js/pantheon-data.js"></script>
    <script src="./scripts/assets/js/script.js"></script>
</body>
</html>
