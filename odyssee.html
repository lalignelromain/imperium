<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mewthology - Odyssée</title>

    <!-- PWA & Métadonnées Mobiles -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#050608">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mewthology">
    <link rel="apple-touch-icon" href="./favicon.png">
    <link rel="icon" type="image/png" href="./favicon.png">

    <!-- Feuilles de style -->
    <link rel="stylesheet" href="./scripts/assets/css/style.css">

    <!-- SDK Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body class="theme-odyssee mode-classeur">

    <!-- En-tête de la Collection -->
    <header class="header-main">
        <h1>Odyssée</h1>
        <p class="subtitle">Grands Formats & Chefs-d'Œuvre</p>
    </header>

    <!-- Commande Bascule Flottante -->
    <div class="mode-switcher-container">
        <div class="mode-switcher" role="tablist" aria-label="Mode d'affichage">
            <button type="button" class="switch-btn active" id="btn-classeur">
                📁 Mode Classeur
            </button>
            <button type="button" class="switch-btn" id="btn-art">
                ✨ Mode Art Pur
            </button>
        </div>
    </div>

    <!-- Conteneur d'affichage des Grands Puzzles & Récits -->
    <main class="collection-container odyssee-container">
        <div id="odyssee-container" class="binder-page">
            <!-- Injecté dynamiquement par script.js -->
        </div>
    </main>

    <!-- Données & Moteur Principal -->
    <script src="./scripts/assets/js/tableaux-data.js"></script>
    <script src="./scripts/assets/js/script.js"></script>
</body>
</html>
